#######################################################################################

# FILE NAME: mode_reference.yaml
# AUTHOR: Caroline Adkins
# LAST UPDATED: October 2026

# This file serves as a reference for the different data extraction/processing methods
# (modes) that can be applied to source data fields. Each mode is defined with its
# specific parameters and usage guidelines.

#######################################################################################

##############################################################
### NONE
### returns a null Series; field is not present or derivable
##############################################################

FIELD_NAME:
  mode: none
  # notes: ""          # optional — use for caveats

##############################################################
### CONSTANT
### returns a Series filled with a single literal value
##############################################################

FIELD_NAME:
  mode: constant
  constant: "VALUE"    # literal string or value written to every row
  # notes: ""          

##############################################################
### COLUMN
### copies a source column directly
##############################################################

FIELD_NAME:
  mode: column
  column: "SOURCE COLUMN NAME"    # exact column header in the spreadsheet
  # notes: ""                 

##############################################################
### EXTRACT
### derives a value from a source column via slice or regex
### methods: slilce and regex
##############################################################

### method: slice (substring extraction)

FIELD_NAME:
  mode: extract
  extract:
    column: "SOURCE COLUMN NAME"
    method: slice
    slice:
      start: 0    # 0-indexed start position (inclusive)
      end: 2      # 0-indexed end position (exclusive)
  # notes: ""     


### method: regex (regular expression extraction)

FIELD_NAME:
  mode: extract
  extract:
    column: "SOURCE COLUMN NAME"
    method: regex
    regex:
      pattern: "PATTERN"    # regular expression with at least one capture group
      group: 1              # capture group to return: 0 = full match, 1 = first group, etc.
  # notes: ""                 

##############################################################
### CONCAT
### joins multiple source columns with a delimiter
##############################################################

FIELD_NAME:
  mode: concat
  concat:
    columns: ["SOURCE_COLUMN_1", "SOURCE_COLUMN_2"]   # list of source columns to concatenate
    delimiter: " "                                    # string to insert between values
  # notes: ""

##############################################################
### CROSSWALK
### maps source column values to output values via an explicit 
### dictionary
##############################################################

FIELD_NAME:
  mode: crosswalk
  crosswalk:
    column: "SOURCE COLUMN NAME"    # source column whose values will be mapped
    map:
      "SOURCE_VALUE_1": "OUTPUT_VALUE_1"
      "SOURCE_VALUE_2": "OUTPUT_VALUE_2"
      "SOURCE_VALUE_3": "OUTPUT_VALUE_3"
  # notes: ""        

##############################################################
### LOOKUP
### returns a value from a reference table by matching
### one already-resolved field
###
### Available Reference tables:
###   us_counties   →  conus_county_boundaries.geojson
###   us_states     →  conus_state_boundaries.geojson
###   uic_authority →  uic_authority.xlsx
##############################################################
FIELD_NAME:
  mode: lookup
  lookup:
    column: "RESOLVED_FIELD"     # a field already resolved earlier in processing pipeline
    table: table_name           # reference table name (us_counties | us_states | uic_authority)
    key_field: "KEY_FIELD"           # column in the table to match against
    return_field: "RETURN_FIELD"  # column in the table to return

##############################################################
### COMPUTE
### applies an aggregate function (mean, min, max, etc.) across
### multiple numeric source columns within each row
##############################################################

FIELD_NAME:
  mode: compute
  compute:
    columns: ["SOURCE_COLUMN_1", "SOURCE_COLUMN_2"]   # list of numeric source columns to compute over
    operation: mean # aggregate function: mean | median | sum | min | max
  # notes: "" 

##############################################################
### REPROJECT
### handles coordinate conversions and projection changes;
### returns a DataFrame with latitude and longitude columns
##############################################################

coordinates: # only applicable to coordinates field name
  mode: reproject
  reproject:
    x_columns: "COLUMN_NAME"   # source column(s) for x-coordinate values (longitude)
    y_columns: "COLUMN_NAME"  # source column(s) for y-coordinate values (latitude)
    input_format: "FORMAT" # input format: dd | dd_combined |dms_colon | dms_compact | dms_expanded | northing_easting
    datum:                # source datum (coordinate reference system) of the input coordinates (e.g., EPSG:26917). Put mode none if unknown.
      mode: none
  # notes: "Unknown source CRS. Assuming NAD83 (EPSG:4269)."

##############################################################
### GEOCODE
### converts an address or PLSS description to coordinates
### methods: plss and address
##############################################################

### method: plss (Public Land Survey System)

coordinates: # only applicable to the coordinates field
  mode: geocode
  geocode:
    method: plss
    plss_fields: # indicate which PLSS fields are present in the source data and how to extract them using existing modes
      state:
        mode: XXX
      meridian: 
        mode: XXX
      township_num:
        mode: XXX
      township_frac:
        mode: XXX
      township_dir:
        mode: XXX
      range_num:
        mode: XXX
      range_frac:
        mode: XXX
      range_dir:
        mode: XXX
      section:
        mode: XXX
  # notes: ""

### method: address (Street Address)
coordinates: # only applicable to coordinates field
  mode: geocode
  geocode:
    method: address
    address_fields: # indicate which address fields are present in the source data and how to extract them using existing modes
      street:
        mode: XXX
      city:
        mode: XXX
      state:
        mode: XXX
      zip:
        mode: XXX
  # notes: ""

##############################################################
### LOCATE
### derives a field value via spatial point-in-polygon join
### using resolved coordinates
##############################################################
FIELD_NAME:
  mode: locate
  notes: "No column with [county code / state identifier / etc.]. Use location to determine [field]."