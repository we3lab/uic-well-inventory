#######################################################################################
# wy_ii
#######################################################################################

##############################################################
### DATA SOURCE
##############################################################
provenance:
  agency: "WY Oil and Gas Conservation Commission" 	# name of agency from which dataset was retrieved (e.g. WV Dept of Environmental Protection, EPA Region 3, etc.)
  source_address: "tom.kropatsch@wyo.gov"	# email (if provided by a person) or URL (if downloaded from a website)
  date_retrieved: "2026-08-31"	# date the data was retrieved/received from the source (YYYY-MM-DD)
  notes: "–"   # any notes on the file itself (processing steps, etc.)


##############################################################
### SPECS
##############################################################
sheets:

  "Query9":

    load_specs:
      header_row: 0       # 0-indexed row number of the header row in the source sheet
      data_cols: "A:J"     # passed to usecols in pd.read_excel() to select the columns to read in (e.g. "A:Z" or "A,B,C,D,E" or [0,1,2,3,4])
    
    coordinates:
      mode: reproject
      reproject:
        x_columns: "Longitude"   # source column(s) for x-coordinate values (longitude)
        y_columns: "Latitude"  # source column(s) for y-coordinate values (latitude)
        input_format: "dd" # input format: dd | dd_combined |dms_colon | dms_compact | dms_expanded | northing_easting
        datum:                # source datum (coordinate reference system) of the input coordinates (e.g., EPSG:26917). Put mode none if unknown.
          mode: none
      notes: "Unknown source CRS. Assuming NAD83 (EPSG:4269)."     
    
    state_alpha:
      mode: constant
      constant: "WY"        
    
    epa_region:
      mode: constant
      constant: "Region 8"        
    
    county_name:
      mode: locate
      notes: "County name is not provided in the source data. Will be determined based on coordinates."        
    
    geoid:
      mode: lookup
      lookup:
        columns: ["state_alpha", "county_name"]
        table: us_counties
        key_fields: ["state_alpha", "county_name"]
        return_field: "geoid"  # column in the table to return
    
    well_id:
      mode: column
      column: "API Number"        
    
    well_id_type:
      mode: constant
      constant: "API Number"        
    
    well_subtype:
      mode: crosswalk
      crosswalk:
        column: "Well Class"
        map:
          "D": "2D"
          "I": "2R"
          
    well_subtype_raw:
      mode: column
      column: "Well Class"
    
    well_class:
      mode: constant
      constant: "II"
    
    well_depth_ft:
      mode: none
    
    well_depth_ft_type:
      mode: none
    
    associated_entity:
      mode: column
      column: "Operator"
    
    associated_entity_type:
      mode: constant
      constant: "Operator"
    
    status:
      mode: none
    
    status_raw:
      mode: none
    
    date:
      mode: none
    
    date_type:
      mode: none
    

   
      