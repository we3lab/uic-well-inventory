#######################################################################################
# mo_ii
#######################################################################################

##############################################################
### DATA SOURCE
##############################################################
provenance:
  agency: "MO Department of Natural Resources" # name of agency from which dataset was retrieved (e.g. WV Dept of Environmental Protection, EPA Region 3, etc.)
  source_address: "https://gis-modnr.opendata.arcgis.com/datasets/modnr::oil-and-gas-wells/explore"	# email (if provided by a person) or URL (if downloaded from a website)
  date_retrieved: "2026-09-28"	# date the data was retrieved/received from the source (YYYY-MM-DD)
  notes: "–" # any notes on the file itself (processing steps, etc.)


##############################################################
### SPECS
##############################################################
sheets:

  "Oil_and_Gas_Wells":

    load_specs:
      header_row: 0       # 0-indexed row number of the header row in the source sheet
      data_cols: "A:AH"     # passed to usecols in pd.read_excel() to select the columns to read in (e.g. "A:Z" or "A,B,C,D,E" or [0,1,2,3,4])
    
    coordinates: # only applicable to coordinates field name
      mode: reproject
      reproject:
        x_columns: "LONGITUDE"   # source column(s) for x-coordinate values (longitude)
        y_columns: "LATITUDE"  # source column(s) for y-coordinate values (latitude)
        input_format: "dd" # input format: dd | dd_combined |dms_colon | dms_compact | dms_expanded | northing_easting
        datum:                # source datum (coordinate reference system) of the input coordinates (e.g., EPSG:26917). Put mode none if unknown.
          mode: none
      notes: "Unknown source CRS. Assuming NAD83 (EPSG:4269)."     
    
    state_alpha:
      mode: constant
      constant: "MO"        
    
    epa_region:
      mode: constant
      constant: "Region 7"        
    
    county_name:
      mode: column
      column: "COUNTY"        
    
    geoid:
      mode: lookup
      lookup:
        columns: ["state_alpha", "county_name"]
        table: us_counties
        key_fields: ["state_alpha", "county_name"]
        return_field: "geoid"  # column in the table to return
    
    well_id:
      mode: column
      column: "API_NUMBER"        
    
    well_id_type:
      mode: constant
      constant: "API Number"        
    
    well_subtype:
      mode: crosswalk
      crosswalk:
        column: "WELL_TYPE"
        map:
          "Injection(Class II EOR)": "2R"
          "Water Well": "0X"
          "Oil": "0X"
          "Gas(Private Use)": "0X"
          "Injection(Class II Disposal)": "2D"
          "Observation": "0X"
          "Water Well, Non Oil/Gas Related (has down-hole log)": "0X"
          "Gas(Coalbed Methane)": "0X"
          "Stratigraphic Test": "0X"
          "Gas(Convertional, Commercial)": "0X"
          "Gas Storage Wells": "2H"
          "Dry Hole": "0X"
          "Horizontal Oil Well": "0X"
          "Unknown Well Type": null
          "Injection(Water Curtain)": "2X"
          "Stratigraphic Test, Non Oil/Gas Related (has down-hole log)": "0X"

    well_subtype_raw:
      mode: column
      column: "WELL_TYPE"
    
    well_class:
      mode: lookup
      lookup:
        columns: "well_subtype"     # a field (or list of fields) already resolved earlier in processing pipeline
        table: well_subtypes           # reference table name (us_counties | us_states | uic_authority)
        key_fields: "well_subtype"           # column(s) in the table to match against
        return_field: "well_class"  # column in the table to return
    
    well_depth_ft:
      mode: column
      column: "TOTAL_DPTH"

    well_depth_ft_type:
      mode: constant
      constant: "MD"
      notes: "Depth reported as Total Depth and assumed to be representative of Measured Depth."
    
    associated_entity:
      mode: column
      column: "OPERATOR"

    associated_entity_type:
      mode: constant
      constant: "Operator"
    
    status:
      mode: crosswalk
      crosswalk:
        column: "STATUS"
        map:
          "Active Well": "Active"
          "Plugged - Approved": "Inactive"
          "Shut in - Extended": "Inactive"
          "Water Well Conversion": "Other"
          "Plugged - Not Approved": "Inactive"
          "Orphaned": "Inactive"
          "Shut in - Incomplete": "Inactive"
          "Shut in - Complete": "Inactive"
          "Inactive – Initial 90 day window": "Inactive"
          "Abandoned, Known Location and Verified": "Inactive"
          "Abandoned, No evidence of existence/ Unable to find": "Other"
          "Pending Shut in Approval": "Other"
          "Abandoned": "Inactive"
          "Abandoned, Unknown Location": "Inactive"
          "Temporarily Abandoned(Idle)": "Inactive"
    
    status_raw:
      mode: column
      column: "STATUS"
    
    date:
      mode: column
      column: "STATUSDATE"
    
    date_type:
      mode: constant
      constant: "Status Date"
    

   
      