#######################################################################################
# epa7_ii-v
#######################################################################################

##############################################################
### DATA SOURCE
##############################################################
provenance:
  agency: "EPA Region 7"     # name of agency from which dataset was retrieved (e.g. WV Dept of Environmental Protection, EPA Region 3, etc.)
  source_address: "zipf.lynn@epa.go"    # email (if provided by a person) or URL (if downloaded from a website)
  date_retrieved: "2025-08-15"    # date the data was retrieved/received from the source (YYYY-MM-DD)
  notes: "Received post FOIA submission"    # any notes on the file itself (processing steps, etc.)

##############################################################
### SPECS
##############################################################
sheets:

  "R7":

    load_specs:
      header_row: 0       # 0-indexed row number of the header row in the source sheet
      data_cols: "A:E"     # passed to usecols in pd.read_excel() to select the columns to read in (e.g. "A:Z" or "A,B,C,D,E" or [0,1,2,3,4])
    
    coordinates: # only applicable to coordinates field name
      mode: reproject
      reproject:
        x_columns: "Longitude"   # source column(s) for x-coordinate values (longitude)
        y_columns: "Latitude"  # source column(s) for y-coordinate values (latitude)
        input_format: "dd" # input format: dd | dd_combined |dms_colon | dms_compact | dms_expanded | northing_easting
        datum:                # source datum (coordinate reference system) of the input coordinates (e.g., EPSG:26917). Put mode none if unknown.
          mode: none
      notes: "Unknown source CRS. Assuming NAD83 (EPSG:4269)."          
    
    state_alpha:
      mode: locate
      notes: "No column with state code available. Use location to determine state."        
    
    epa_region:
      mode: constant
      constant: 7        
    
    county_name:
      mode: locate
      notes: "No column with county code available. Use location to determine county name."        
    
    geoid:
      mode: lookup
      lookup:
        column: "county_name"     # a field already resolved earlier in processing pipeline
        table: us_counties           # reference table name
        key_field: "county_name"      # column in the table to match against
        return_field: "geoid"     # column in the table to return  
    
    well_id:
      mode: column
      column: "Well Name"        
    
    well_id_desc:
      mode: constant
      constant: "Well Name"        
    
    well_subtype:
      mode: crosswalk
      crosswalk:
        column: "Well Class"
        map:
          "II-D" : "2D"
          "V"    : None

    well_subtype_raw:
      mode: crosswalk
      crosswalk:
        column: "Well Class"
        map:
          "II-D" : "II-D"
          "V"    : None
    
    well_class:
      mode: crosswalk
      crosswalk:
        column: "Well Class"
        map:
          "II-D" : "II"
          "V"    : "V"
    
    well_depth_ft:
      mode: column
      column: "Injection Interval Depth"
    
    well_depth_ft_desc:
      mode: constant
      constant: "TIZ"
    
    operator:
      mode: none
    
    operator_desc:
      mode: none
    
    status:
      mode: none
    
    status_raw:
      mode: none
    
    date:
      mode: none
    
    date_desc:
      mode: none
    

   
      