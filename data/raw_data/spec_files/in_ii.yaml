#######################################################################################
# in_ii
#######################################################################################

##############################################################
### DATA SOURCE
##############################################################
provenance:
  agency: ""    # name of agency from which dataset was retrieved (e.g. WV Dept of Environmental Protection, EPA Region 3, etc.)
  source_address: ""    # email (if provided by a person) or URL (if downloaded from a website)
  date_retrieved: ""    # date the data was retrieved/received from the source (YYYY-MM-DD)
  notes: ""    # any notes on the file itself (processing steps, etc.)

##############################################################
### SPECS
##############################################################
sheets:

  "OilAndGasWells_-194785171607052":

    load_specs:
      header_row: 0       # 0-indexed row number of the header row in the source sheet
      data_cols: "A:Y"     # passed to usecols in pd.read_excel() to select the columns to read in (e.g. "A:Z" or "A,B,C,D,E" or [0,1,2,3,4])
    
    coordinates: # only applicable to coordinates field name
      mode: reproject
      reproject:
        x_columns: "Utmx"   # source column(s) for x-coordinate values (longitude)
        y_columns: "Utmy"  # source column(s) for y-coordinate values (latitude)
        input_format: "northing_easting" # input format: dd | dd_combined |dms_colon | dms_compact | dms_expanded | northing_easting
        datum:                # source datum (coordinate reference system) of the input coordinates (e.g., EPSG:26917). Put mode none if unknown.
          mode: constant
          constant: "EPSG:26916"    
    
    state_alpha:
      mode: constant
      constant: "IN"        
    
    epa_region:
      mode: constant
      constant: "Region 5"        
    
    county_name:
      mode: column
      column: "County"        
    
    geoid:
      mode: lookup
      lookup:
        columns: ["state_alpha", "county_name"]
        table: us_counties
        key_fields: ["state_alpha", "county_name"]
        return_field: "geoid"     # column in the table to return         
    
    well_id:
      mode: column
      column: "Permit_Number"        
    
    well_id_desc:
      mode: constant
      constant: "Permit Number"        
    
    well_subtype:
      mode: none

    well_subtype_raw:
      mode: none
    
    well_class:
      mode: constant
      constant: "II"
    
    well_depth_ft:
      mode: none
    
    well_depth_ft_desc:
      mode: none
    
    operator:
      mode: column
      column: "Operator_Name"
    
    operator_desc:
      mode: constant
      constant: "Company"
    
    status:
      mode: crosswalk
      crosswalk:
        column: "Status"
        map:
          "Active" : "Active"
          "Plugged" : "Inactive"
          "Revoked" : "Inactive"
          "Inactive" : "Inactive"
          "TA" : "Inactive"
          "Plugd & Abandnd" : "Inactive"
          "Not Drilled" : "Inactive"
    
    status_raw:
      mode: column
      column: "Status"
    
    date:
      mode: none
    
    date_desc:
      mode: none
    

   
      