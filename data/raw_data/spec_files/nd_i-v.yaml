#######################################################################################
# nd_i-v
#######################################################################################

##############################################################
### DATA SOURCE
##############################################################
provenance:
  agency: ""    # name of agency from which dataset was retrieved (e.g. WV Dept of Environmental Protection, EPA Region 3, etc.)
  source_address: ""    # email (if provided by a person) or URL (if downloaded from a website)
  date_retrieved: ""    # date the data was retrieved/received from the source (YYYY-MM-DD)
  notes: ""    # any notes on the file itself (processing steps, etc.)

##############################################################
### SPECS
##############################################################
sheets:

  "tblAll_UIC_Wells":

    load_specs:
      header_row: 0       # 0-indexed row number of the header row in the source sheet
      data_cols: "A:L"     # passed to usecols in pd.read_excel() to select the columns to read in (e.g. "A:Z" or "A,B,C,D,E" or [0,1,2,3,4])
    
    coordinates: # only applicable to coordinates field name
      mode: reproject
      reproject:
        x_columns: "Decimal Longitude"   # source column(s) for x-coordinate values (longitude)
        y_columns: "Decimal Latitude"  # source column(s) for y-coordinate values (latitude)
        input_format: "dd" # input format: dd | dd_combined |dms_colon | dms_compact | dms_expanded | northing_easting
        datum:                # source datum (coordinate reference system) of the input coordinates (e.g., EPSG:26917). Put mode none if unknown.
          mode: none
      notes: "Unknown source CRS. Assuming NAD83 (EPSG:4269)."     
    
    state_alpha:
      mode: constant
      constant: "ND"        
    
    epa_region:
      mode: constant
      constant: 8        
    
    county_name:
      mode: locate    
      notes: "No county name column in source data. Will locate county based on coordinates."    
    
    geoid:
      mode: lookup
      lookup:
        columns: ["state_alpha", "county_name"]
        table: us_counties
        key_fields: ["state_alpha", "county_name"]
        return_field: "geoid"  # column in the table to return
    
    well_id:
      mode: column
      column: "Well ID"        
    
    well_id_desc:
      mode: constant
      constant: "Well ID"        
    
    well_subtype:
      mode: crosswalk
      crosswalk:
        column: "Well Type"
        map:
          "Septic Systems": "5F"
          "Motor Vehicle Waste Disposal": "5K"
          "Carwashes": "5A1"
          "Carwashes where no engine or undercarriage washing is performed": "5A2"
          "Drainage (1987 category - Stormwater Drainage)": "5H"
          "Machine and welding shops": "5A10"
          "Metal plating / fabrication facilities": "5A16"
          "Any other wells used to inject non-hazardous wastewaters generated by industrial, commercial, and service establishments and that are not included in one of the above categories": "5A24"
          "Wells used to inject heat pump return fluids": "5C2"
          "Industrial Well": "5A"
          "Other": null
          "Subsurface environmental remediation": "5B6"
          "Veterinary, kennel and pet grooming service facilities": "5A15"
          "Food processing operations": "5A20"
          "Sewage Treatment Effluent": "5D"
          "* Drinking Water Treatment Residual": "5A23"
          "Non-Hazardous Industrial": "1I"

    well_subtype_raw:
      mode: column
      column: "Well Type"
    
    well_class:
      mode: lookup
      lookup:
        columns: "well_subtype"     # a field (or list of fields) already resolved earlier in processing pipeline
        table: well_subtypes           # reference table name (us_counties | us_states | uic_authority)
        key_fields: "well_subtype"           # column(s) in the table to match against
        return_field: "well_class"  # column in the table to return

    well_depth_ft:
      mode: none
    
    well_depth_ft_desc:
      mode: none
    
    operator:
      mode: column
      column: "Facility Name"
    
    operator_desc:
      mode: constant
      constant: "Site Name"
    
    status:
      mode: crosswalk
      crosswalk:
        column: "Well Status"
        map:
          "Temporarily Abandoned or Inactive": "Inactive"
          "Active": "Active"
          "No Well": "Other"
          "Permanently Abandoned and Approved by State": "Inactive"
          "Proposed Well (associated with permit application only)": "Other"
          "Permanently Abandoned and not Approved by State": "Inactive"
    
    status_raw:
      mode: column
      column: "Well Status"
    
    date:
      mode: none
    
    date_desc:
      mode: none
    

   
      