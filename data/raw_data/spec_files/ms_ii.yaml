#######################################################################################
# ms_ii
#######################################################################################

##############################################################
### DATA SOURCE
##############################################################
provenance:
  agency: ""    # name of agency from which dataset was retrieved (e.g. WV Dept of Environmental Protection, EPA Region 3, etc.)
  source_address: ""    # email (if provided by a person) or URL (if downloaded from a website)
  date_retrieved: ""    # date the data was retrieved/received from the source (YYYY-MM-DD)
  notes: ""    # any notes on the file itself (processing steps, etc.)

##############################################################
### SPECS
##############################################################
sheets:

  "EOR":

    load_specs:
      header_row: 0       # 0-indexed row number of the header row in the source sheet
      data_cols: "A:Q"     # passed to usecols in pd.read_excel() to select the columns to read in (e.g. "A:Z" or "A,B,C,D,E" or [0,1,2,3,4])
    
    coordinates: # only applicable to coordinates field name
      mode: reproject
      reproject:
        x_columns: "Long_NAD83"   # source column(s) for x-coordinate values (longitude)
        y_columns: "Lat_NAD83"  # source column(s) for y-coordinate values (latitude)
        input_format: "dd" # input format: dd | dd_combined |dms_colon | dms_compact | dms_expanded | northing_easting
        datum:                # source datum (coordinate reference system) of the input coordinates (e.g., EPSG:26917). Put mode none if unknown.
          mode: constant
          constant: "EPSG:4269"   
    
    state_alpha:
      mode: constant
      constant: "MS"        
    
    epa_region:
      mode: constant
      constant: 4        
    
    county_name:
      mode: column
      column: "County"        
    
    geoid:
      mode: lookup
      lookup:
        columns: ["state_alpha", "county_name"]
        table: us_counties
        key_fields: ["state_alpha", "county_name"]
        return_field: "geoid"  # column in the table to return
    
    well_id:
      mode: column
      column: "API 14"        
    
    well_id_desc:
      mode: constant
      constant: "API Number"        
    
    well_subtype:
      mode: constant
      constant: "2R"

    well_subtype_raw:
      mode: constant
      constant: "EOR"
    
    well_class:
      mode: constant
      constant: "II"
    
    well_depth_ft:
      mode: none
    
    well_depth_ft_desc:
      mode: none
    
    operator:
      mode: column
      column: "Operator"
    
    operator_desc:
      mode: constant
      constant: "Company"
    
    status:
      mode: none
      notes: "Interpretation of status codes is not clear in the source data. No crosswalk applied."
    
    status_raw:
      mode: column
      column: "Status"
    
    date:
      mode: none
    
    date_desc:
      mode: none

