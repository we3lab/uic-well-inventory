#######################################################################################
# oh_ii-iii
#######################################################################################

##############################################################
### DATA SOURCE
##############################################################
provenance:
  agency: ""    # name of agency from which dataset was retrieved (e.g. WV Dept of Environmental Protection, EPA Region 3, etc.)
  source_address: ""    # email (if provided by a person) or URL (if downloaded from a website)
  date_retrieved: ""    # date the data was retrieved/received from the source (YYYY-MM-DD)
  notes: ""    # any notes on the file itself (processing steps, etc.)

##############################################################
### SPECS
##############################################################
sheets:

  "Sheet1":

    load_specs:
      header_row: 0       # 0-indexed row number of the header row in the source sheet
      data_cols: "A:F"     # passed to usecols in pd.read_excel() to select the columns to read in (e.g. "A:Z" or "A,B,C,D,E" or [0,1,2,3,4])
    
    coordinates:
      mode: none    
    
    state_alpha:
      mode: constant
      constant: "OH"        
    
    epa_region:
      mode: constant
      constant: "Region 5"        
    
    county_name:
      mode: crosswalk
      crosswalk:
        column: "CNTY"
        map:
          "1" : "Adams"
          "3" : "Allen"
          "5" : "Ashland"
          "7" : "Ashtabula"
          "9" : "Athens"
          "11" : "Auglaize"
          "13" : "Belmont"
          "15" : "Brown"
          "17" : "Butler"
          "19" : "Carroll"
          "21" : "Champaign"
          "23" : "Clark"
          "25" : "Clermont"
          "27" : "Clinton"
          "29" : "Columbiana"
          "31" : "Coshocton"
          "33" : "Crawford"
          "35" : "Cuyahoga"
          "37" : "Darke"
          "39" : "Defiance"
          "41" : "Delaware"
          "43" : "Erie"
          "45" : "Fairfield"
          "47" : "Fayette"
          "49" : "Franklin"
          "51" : "Fulton"
          "53" : "Gallia"
          "55" : "Geauga"
          "57" : "Greene"
          "59" : "Guernsey"
          "61" : "Hamilton"
          "63" : "Hancock"
          "65" : "Hardin"
          "67" : "Harrison"
          "69" : "Henry"
          "71" : "Highland"
          "73" : "Hocking"
          "75" : "Holmes"
          "77" : "Huron"
          "79" : "Jackson"
          "81" : "Jefferson"
          "83" : "Knox"
          "85" : "Lake"
          "87" : "Lawrence"
          "89" : "Licking"
          "91" : "Logan"
          "93" : "Lorain"
          "95" : "Lucas"
          "97" : "Madison"
          "99" : "Mahoning"
          "101" : "Marion"
          "103" : "Medina"
          "105" : "Meigs"
          "107" : "Mercer"
          "109" : "Miami"
          "111" : "Monroe"
          "113" : "Montgomery"
          "115" : "Morgan"
          "117" : "Morrow"
          "119" : "Muskingum"
          "121" : "Noble"
          "123" : "Ottawa"
          "125" : "Paulding"
          "127" : "Perry"
          "129" : "Pickaway"
          "131" : "Pike"
          "133" : "Portage"
          "135" : "Preble"
          "137" : "Putnam"
          "139" : "Richland"
          "141" : "Ross"
          "143" : "Sandusky"
          "145" : "Scioto"
          "147" : "Seneca"
          "149" : "Shelby"
          "151" : "Stark"
          "153" : "Summit"
          "155" : "Trumbull"
          "157" : "Tuscarawas"
          "159" : "Union"
          "161" : "Van Wert"
          "163" : "Vinton"
          "165" : "Warren"
          "167" : "Washington"
          "169" : "Wayne"
          "171" : "Williams"
          "173" : "Wood"
          "175" : "Wyandot"
          "534" : "Lake Erie"
      notes: "County codes are assumed to be API codes. Mapping based on that found at https://dl.ppdm.org/dl/796"

    
    geoid:
      mode: lookup
      lookup:
        columns: ["state_alpha", "county_name"]
        table: us_counties
        key_fields: ["state_alpha", "county_name"]
        return_field: "geoid"  # column in the table to return
    
    well_id:
      mode: column
      column: "API_WELLNO"        
    
    well_id_desc:
      mode: constant
      constant: "API Number"        
    
    well_subtype:
      mode: crosswalk
      crosswalk:
        column: "WELL_TYP"
        map:
          "ER_R": "2R"
          "SW_R": "2D"
          "IW_R": "2X"
          "SM_R": "3A"

    well_subtype_raw:
      mode: column
      column: "WELL_TYP"
    
    well_class:
      mode: lookup
      lookup:
        columns: "well_subtype"     # a field (or list of fields) already resolved earlier in processing pipeline
        table: well_subtypes           # reference table name (us_counties | us_states | uic_authority)
        key_fields: "well_subtype"           # column(s) in the table to match against
        return_field: "well_class"  # column in the table to return
    
    well_depth_ft:
      mode: none
    
    well_depth_ft_desc:
      mode: none
    
    operator:
      mode: none
    
    operator_desc:
      mode: none
    
    status:
      mode: crosswalk
      crosswalk:
        column: "WL_STATUS"
        map:
          "AI": "Active"
    
    status_raw:
      mode: column
      column: "WL_STATUS"
    
    date:
      mode: none
    
    date_desc:
      mode: none
    

   
      