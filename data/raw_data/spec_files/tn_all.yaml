#######################################################################################
# tn_all
#######################################################################################

##############################################################
### DATA SOURCE
##############################################################
provenance:
  agency: ""    # name of agency from which dataset was retrieved (e.g. WV Dept of Environmental Protection, EPA Region 3, etc.)
  source_address: ""    # email (if provided by a person) or URL (if downloaded from a website)
  date_retrieved: ""    # date the data was retrieved/received from the source (YYYY-MM-DD)
  notes: ""    # any notes on the file itself (processing steps, etc.)

##############################################################
### SPECS
##############################################################
sheets:

  "Underground Injection Control I":

    load_specs:
      header_row: 0       # 0-indexed row number of the header row in the source sheet
      data_cols: "A:Y"     # passed to usecols in pd.read_excel() to select the columns to read in (e.g. "A:Z" or "A,B,C,D,E" or [0,1,2,3,4])
    
    coordinates:
      mode: reproject
      reproject:
        x_columns: "Longitude"   # source column(s) for x-coordinate values (longitude)
        y_columns: "Latitude"  # source column(s) for y-coordinate values (latitude)
        input_format: "dd" # input format: dd | dd_combined |dms_colon | dms_compact | dms_expanded | northing_easting
        datum:                # source datum (coordinate reference system) of the input coordinates (e.g., EPSG:26917). Put mode none if unknown.
          mode: none
      notes: "Unknown source CRS. Assuming NAD83 (EPSG:4269)."     
    
    state_alpha:
      mode: constant
      constant: "TN"        
    
    epa_region:
      mode: constant
      constant: 4        
    
    county_name:
      mode: column
      column: "County"        
    
    geoid:
      mode: lookup
      lookup:
        columns: ["state_alpha", "county_name"]
        table: us_counties
        key_fields: ["state_alpha", "county_name"]
        return_field: "geoid"  # column in the table to return
    
    well_id:
      mode: column
      column: "Site Link"        
    
    well_id_desc:
      mode: constant
      constant: "Site ID"        
    
    well_subtype:
      mode: crosswalk
      crosswalk:
        column: "Project Type"
        map:
          "Bio-remediation": "5B6"
          "SFDS": "5F"
          "Storm water to well": "5H1"
          "Infiltration cell": "5H"
          "Geothermal heat pump": "5C2"
          "Drip Disposal System": "5F"
          "Stormwater to well": "5H1"
          "Control leak": null
          "Drilled injection well": null
          "Mine injection": "5I"
          "Modified Recharge Area/Point": "5B1"
          "Bio-remeditaion": "5B6"
          "Class II - Injection": "2X"
          "Class II - Commercial": "2D"
          "Drinking water injection": "5B4"

    well_subtype_raw:
      mode: column
      column: "Project Type"
    
    well_class:
      mode: lookup
      lookup:
        columns: "well_subtype"     # a field (or list of fields) already resolved earlier in processing pipeline
        table: well_subtypes           # reference table name (us_counties | us_states | uic_authority)
        key_fields: "well_subtype"           # column(s) in the table to match against
        return_field: "well_class"  # column in the table to return
    
    well_depth_ft:
      mode: none
    
    well_depth_ft_desc:
      mode: none
    
    operator:
      mode: column
      column: "Company"
    
    operator_desc:
      mode: constant
      constant: "Company"
    
    status:
      mode: none
    
    status_raw:
      mode: none
    
    date:
      mode: column
      column: "Received"
    
    date_desc:
      mode: constant
      constant: "Application Date"
    

   
      