#######################################################################################
# ok_all
#######################################################################################

##############################################################
### DATA SOURCE
##############################################################
provenance:
  agency: ""    # name of agency from which dataset was retrieved (e.g. WV Dept of Environmental Protection, EPA Region 3, etc.)
  source_address: ""    # email (if provided by a person) or URL (if downloaded from a website)
  date_retrieved: ""    # date the data was retrieved/received from the source (YYYY-MM-DD)
  notes: ""    # any notes on the file itself (processing steps, etc.)

##############################################################
### SPECS
##############################################################
sheets:

  "SHEET_NAME_1":

    load_specs:
      header_row:       # 0-indexed row number of the header row in the source sheet
      data_cols: ""     # passed to usecols in pd.read_excel() to select the columns to read in (e.g. "A:Z" or "A,B,C,D,E" or [0,1,2,3,4])
    
    coordinates:
      mode: reproject
      reproject:
        x_columns: "COLUMN_NAME"   # source column(s) for x-coordinate values (longitude)
        y_columns: "COLUMN_NAME"  # source column(s) for y-coordinate values (latitude)
        input_format: "FORMAT" # input format: dd | dd_combined |dms_colon | dms_compact | dms_expanded | northing_easting
        datum:                # source datum (coordinate reference system) of the input coordinates (e.g., EPSG:26917). Put mode none if unknown.
          mode: none
      # notes: "Unknown source CRS. Assuming NAD83 (EPSG:4269)."     
    
    state_alpha:
      mode: none        
    
    epa_region:
      mode: none        
    
    county_name:
      mode: none        
    
    geoid:
      mode: lookup
      lookup:
        columns: ["state_alpha", "county_name"]
        table: us_counties
        key_fields: ["state_alpha", "county_name"]
        return_field: "geoid"  # column in the table to return
    
    well_id:
      mode: none        
    
    well_id_desc:
      mode: none        
    
    well_subtype:
      mode: crosswalk
      crosswalk:
        column: "COLUMN_NAME"
        map:
          "SOURCE_VALUE_1": "OUTPUT_VALUE_1"
          "SOURCE_VALUE_2": "OUTPUT_VALUE_2"
          "SOURCE_VALUE_3": "OUTPUT_VALUE_3"

    well_subtype_raw:
      mode: none
    
    well_class:
      mode: none
    
    well_depth_ft:
      mode: none
    
    well_depth_ft_desc:
      mode: none
    
    operator:
      mode: none
    
    operator_desc:
      mode: none
    
    status:
      mode: crosswalk
      crosswalk:
        column: "COLUMN_NAME"
        map:
          "SOURCE_VALUE_1": "OUTPUT_VALUE_1"
          "SOURCE_VALUE_2": "OUTPUT_VALUE_2"
          "SOURCE_VALUE_3": "OUTPUT_VALUE_3"
    
    status_raw:
      mode: none
    
    date:
      mode: none
    
    date_desc:
      mode: none
    

   
      