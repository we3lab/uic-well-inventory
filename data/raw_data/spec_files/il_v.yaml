#######################################################################################
# il_v
#######################################################################################

##############################################################
### DATA SOURCE
##############################################################
provenance:
  agency: ""    # name of agency from which dataset was retrieved (e.g. WV Dept of Environmental Protection, EPA Region 3, etc.)
  source_address: ""    # email (if provided by a person) or URL (if downloaded from a website)
  date_retrieved: ""    # date the data was retrieved/received from the source (YYYY-MM-DD)
  notes: ""    # any notes on the file itself (processing steps, etc.)

##############################################################
### SPECS
##############################################################
sheets:

  "Sheet1":

    load_specs:
      header_row: 0       # 0-indexed row number of the header row in the source sheet
      data_cols: "A:AC"     # passed to usecols in pd.read_excel() to select the columns to read in (e.g. "A:Z" or "A,B,C,D,E" or [0,1,2,3,4])
    
    coordinates:
      mode: reproject
      reproject:
        x_columns: ["Long", "LongDeg", "LongMin"]
        y_columns: ["Lat", "LatDeg", "LatMin"]
        input_format: "dms_expanded"
        datum:
          mode: none
      notes: "Unknown source CRS. Assuming NAD83 (EPSG:4269)."     
    
    state_alpha:
      mode: constant
      constant: "IL"        
    
    epa_region:
      mode: constant
      constant: 5        
    
    county_name:
      mode: locate
      notes: "No column with county code available. Use location to determine county name."        
    
    geoid:
      mode: lookup
      lookup:
        columns: ["state_alpha", "county_name"]
        table: us_counties
        key_fields: ["state_alpha", "county_name"]
        return_field: "geoid"     # column in the table to return         
    
    well_id:
      mode: column
      column: "Illinois ID."        
    
    well_id_desc:
      mode: constant
      constant: "Well ID"        
    
    well_subtype:
      mode: crosswalk
      crosswalk:
        column: "CLASS_AND_"
        map:
          "5A19" : "5A"
          "5D2"  : "5H1"
          "5W32" : "5F"
          "5X28" : "5K"
          "5X26" : "5B6"
          "5W20" : "5A"
          "5A7"  : "5C2"
          "5F1"  : "5H2"
          "5X13" : "5I"
          "5W31" : "5F"
          "5D4"  : "5H1"
          "5X25" : "5G"
          "5X27" : "5X"
          "5R21" : "5B1"
          "5W11" : "5F"
          "5X24" : "5X"
          "0"    : "5X" # not in Illinois reference, assuming Other
          "5W12" : "5D"
          "5G30" : "5H3"
          "5W2"  : "5X" # not in Illinois reference, assuming Other
          "5X31" : "5X" # not in Illinois reference, assuming Other
          "5F"   : "5F"
          "5R23" : "5B3"
      notes: "Mapping based on Illinois EPA Class V Injection Well Types (https://epa.illinois.gov/content/dam/soi/en/web/epa/documents/epa-forms/land/permits/class-v-well-types.pdf)."

    well_subtype_raw:
      mode: crosswalk
      crosswalk:
        column: "CLASS_AND_"
        map:
          # Mineral and fossil fuel recovery related wells
          "5X13": "Mining, Sand or Other backfill wells"
          "5X14": "Solution Mining Wells"
          "5X15": "In-situ Fossil Fuel Recovery Wells"
          "5X16": "Spent-Brine Return Flow Wells"
          # Industrial / commercial / utility disposal wells
          "5A19": "Cooling Water Return Flow Wells"
          "5W20": "Industrial Process Waste and Waste Disposal Wells"
          "5X28": "Automobile Service Station Disposal Wells"
          # Oil field production waste disposal wells
          "5X17": "Air Scrubber Waste Disposal Wells"
          "5X18": "Water Softener Regeneration Brine Disposal Wells"
          # Miscellaneous wells
          "5X24": "Radioactive Waste Disposal Wells"
          "5X25": "Experimental Technology Wells"
          "5X26": "Aquifer Remediation Related Wells"
          "5X29": "Abandoned Drinking Water Wells"
          "5X27": "Other Wells"
          # Drainage wells (a.k.a. dry wells)
          "5F1": "Agricultural Drainage Wells"
          "5D2": "Storm Water Drainage Wells"
          "5D3": "Improved Sinkholes"
          "5D4": "Industrial Drainage Wells"
          "5G30": "Special Drainage Wells"
          # Geothermal reinjection wells
          "5A5": "Electric Power Reinjection Wells"
          "5A6": "Direct Heat Reinjection Wells"
          "5A7": "Heat Pump/Air Conditioning Return Flow Wells"
          "5A8": "Groundwater Aquaculture Return Flow Wells"
          # Domestic wastewater disposal wells
          "5W9": "Untreated Sewage Waste Disposal Wells"
          "5W10": "Cesspools"
          "5W11": "Septic Systems (Undifferentiated Disposal Method)"
          "5W31": "Septic System (Well Disposal Method)"
          "5W32": "Septic System (Drainfield Disposal Method)"
          "5W12": "Domestic Wastewater Treatment Plant Effluent Disposal Wells"
          # Recharge wells
          "5R21": "Aquifer Recharge Wells"
          "5R22": "Saline Water Intrusion Barrier Wells"
          "5R23": "Subsidence Control Wells"
          # Other wells
          "0" : ""
          "5W2" : ""
          "5X31" : ""
          "5F"   : ""
      notes: "Mapping based on Illinois EPA Class V Injection Well Types (https://epa.illinois.gov/content/dam/soi/en/web/epa/documents/epa-forms/land/permits/class-v-well-types.pdf)."
    
    well_class:
      mode: constant
      constant: "V"
    
    well_depth_ft:
      mode: none
    
    well_depth_ft_desc:
      mode: none
    
    operator:
      mode: column
      column: "Organization"
    
    operator_desc:
      mode: constant
      constant: "Company"
    
    status:
      mode: none
    
    status_raw:
      mode: none
    
    date:
      mode: column
      column: "FIRST_ENTE"
    
    date_desc:
      mode: constant
      constant: "Permit Date"
      notes: "Assuming that the first entry date is the permit date, as no other date information is provided in the source data."
    

   
      