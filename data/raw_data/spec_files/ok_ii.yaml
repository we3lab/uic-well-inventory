#######################################################################################
# ok_ii
#######################################################################################

##############################################################
### DATA SOURCE
##############################################################
provenance:
  agency: ""    # name of agency from which dataset was retrieved (e.g. WV Dept of Environmental Protection, EPA Region 3, etc.)
  source_address: ""    # email (if provided by a person) or URL (if downloaded from a website)
  date_retrieved: ""    # date the data was retrieved/received from the source (YYYY-MM-DD)
  notes: ""    # any notes on the file itself (processing steps, etc.)

##############################################################
### SPECS
##############################################################
sheets:

  "UIC_WELLS":

    load_specs:
      header_row: 0      # 0-indexed row number of the header row in the source sheet
      data_cols: "A:AL"     # passed to usecols in pd.read_excel() to select the columns to read in (e.g. "A:Z" or "A,B,C,D,E" or [0,1,2,3,4])
    
    coordinates:
      mode: reproject
      reproject:
        x_columns: "X"   # source column(s) for x-coordinate values (longitude)
        y_columns: "Y"  # source column(s) for y-coordinate values (latitude)
        input_format: "dd" # input format: dd | dd_combined |dms_colon | dms_compact | dms_expanded | northing_easting
        datum:                # source datum (coordinate reference system) of the input coordinates (e.g., EPSG:26917). Put mode none if unknown.
          mode: none
      notes: "Unknown source CRS. Assuming NAD83 (EPSG:4269)."     
    
    state_alpha:
      mode: constant
      constant: "OK"        
    
    epa_region:
      mode: constant
      constant: 6        
    
    county_name:
      mode: column
      column: "county"        
    
    geoid:
      mode: lookup
      lookup:
        columns: ["state_alpha", "county_name"]
        table: us_counties
        key_fields: ["state_alpha", "county_name"]
        return_field: "geoid"  # column in the table to return
    
    well_id:
      mode: column
      column: "api"        
    
    well_id_desc:
      mode: constant
      constant: "API Number"        
    
    well_subtype:
      mode: crosswalk
      crosswalk:
        column: "well_type"
        map:
          "2RIn": "2R"
          "2DNC": "2D"
          "2DCm": "2D"
          "LPSW": "2D"
          "2RSI": "2R"
          "INJ": "2X"

    well_subtype_raw:
      mode: column
      column: "well_type"
    
    well_class:
      mode: lookup
      lookup:
        columns: "well_subtype"     # a field (or list of fields) already resolved earlier in processing pipeline
        table: well_subtypes           # reference table name (us_counties | us_states | uic_authority)
        key_fields: "well_subtype"           # column(s) in the table to match against
        return_field: "well_class"  # column in the table to return

    well_depth_ft:
      mode: column
      column: "permit_top"
    
    well_depth_ft_desc:
      mode: constant
      constant: "TIZ"
    
    operator:
      mode: column
      column: "op"
    
    operator_desc:
      mode: constant
      constant: "Company"
    
    status:
      mode: crosswalk
      crosswalk:
        column: "status"
        map:
          "AC"       : "Active"     
          "ACRT"     : "Active"     
          "SIFORDER" : "Inactive"   
    
    status_raw:
      mode: column
      column: "status"
    
    date:
      mode: column
      column: "appr_date"
    
    date_desc:
      mode: constant
      constant: "Permit Date"
    

   
      