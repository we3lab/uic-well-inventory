#######################################################################################
# nm_ii-iii
#######################################################################################

##############################################################
### DATA SOURCE
##############################################################
provenance:
  agency: ""    # name of agency from which dataset was retrieved (e.g. WV Dept of Environmental Protection, EPA Region 3, etc.)
  source_address: ""    # email (if provided by a person) or URL (if downloaded from a website)
  date_retrieved: ""    # date the data was retrieved/received from the source (YYYY-MM-DD)
  notes: ""    # any notes on the file itself (processing steps, etc.)

##############################################################
### SPECS
##############################################################
sheets:

  "Sheet1":

    load_specs:
      header_row: 0       # 0-indexed row number of the header row in the source sheet
      data_cols: "A:Q"     # passed to usecols in pd.read_excel() to select the columns to read in (e.g. "A:Z" or "A,B,C,D,E" or [0,1,2,3,4])
    
    coordinates: # only applicable to the coordinates field
      mode: geocode
      geocode:
        method: plss
        plss_fields: # indicate which PLSS fields are present in the source data and how to extract them using existing modes
          state:
            mode: constant
            constant: "NM"
          meridian: 
            mode: constant
            constant: "23"
          township_num:
            mode: extract
            extract:
              column: "Township"
              method: regex
              regex:
                pattern: '(\d+)(?=[A-Za-z])'
                group: 1
          township_frac:
            mode: none
          township_dir:
            mode: extract
            extract:
              column: "Township"
              method: regex
              regex:
                pattern: '\d+([A-Za-z])'
                group: 1
          range_num:
            mode: extract
            extract:
              column: "Range"
              method: regex
              regex:
                pattern: '(\d+)(?=[A-Za-z])'
                group: 1
          range_frac:
            mode: none
          range_dir:
            mode: extract
            extract:
              column: "Range"
              method: regex
              regex:
                pattern: '\d+([A-Za-z])'
                group: 1
          section:
            mode: column
            column: "Section" 
    
    state_alpha:
      mode: constant
      constant: "NM"        
    
    epa_region:
      mode: constant
      constant: "Region 6"        
    
    county_name:
      mode: locate
      notes: "No county name column in source data. Will locate county based on coordinates."        
    
    geoid:
      mode: lookup
      lookup:
        columns: ["state_alpha", "county_name"]
        table: us_counties
        key_fields: ["state_alpha", "county_name"]
        return_field: "geoid"  # column in the table to return
    
    well_id:
      mode: column
      column: "API"        
    
    well_id_type:
      mode: constant
      constant: "API Number"        
    
    well_subtype:
      mode: crosswalk
      crosswalk:
        column: "Type"
        map:
          "Oil": "0X"
          "Salt Water Disposal": "2D"
          "Gas": "0X"
          "Injection": "2R"
          "Miscellaneous": null
          "Water": "0X"
          "CO2": "0X"
          "Monitor": "0X"
          "Acid Gas Injection": "2D"
          "Observation": "0X"
          "Gas Storage": "2H"
          "Brine": "3A"
          "Helium": "0X"

    well_subtype_raw:
      mode: column
      column: "Type"
    
    well_class:
      mode: lookup
      lookup:
        columns: "well_subtype"     # a field (or list of fields) already resolved earlier in processing pipeline
        table: well_subtypes           # reference table name (us_counties | us_states | uic_authority)
        key_fields: "well_subtype"           # column(s) in the table to match against
        return_field: "well_class"  # column in the table to return
    
    well_depth_ft:
      mode: none
    
    well_depth_ft_type:
      mode: none
    
    associated_entity:
      mode: column
      column: "Current Operator"
    
    associated_entity_type:
      mode: constant
      constant: "Operator"

    
    status:
      mode: crosswalk
      crosswalk:
        column: "Status"
        map:
          "Active": "Active"
          "New": "Other"
          "Approved Temporary Abandonment": "Inactive"
          "Plugged, Not Released": "Inactive"
          "Never Drilled": "Other"
          "Expired Temporary Abandonment": "Inactive"
          "Reclamation Fund Approved": "Inactive"
          "Zones Permanently Plugged": "Other"
          "Zones Temporarily Plugged": "Other"
          "Dry Hole": "Inactive"
          "Reclamation Fund Pending": "Inactive"
    
    status_raw:
      mode: column
      column: "Status"
    
    date:
      mode: column
      column: "Spud Date"

    date_type:
      mode: constant
      constant: "Spud Date"
    

   
      