#######################################################################################
# mt_ii
#######################################################################################

##############################################################
### DATA SOURCE
##############################################################
provenance:
  agency: ""    # name of agency from which dataset was retrieved (e.g. WV Dept of Environmental Protection, EPA Region 3, etc.)
  source_address: ""    # email (if provided by a person) or URL (if downloaded from a website)
  date_retrieved: ""    # date the data was retrieved/received from the source (YYYY-MM-DD)
  notes: ""    # any notes on the file itself (processing steps, etc.)

##############################################################
### SPECS
##############################################################
sheets:

  "download (1)":

    load_specs:
      header_row: 0       # 0-indexed row number of the header row in the source sheet
      data_cols: "A:U"     # passed to usecols in pd.read_excel() to select the columns to read in (e.g. "A:Z" or "A,B,C,D,E" or [0,1,2,3,4])
    
    coordinates: # only applicable to the coordinates field
      mode: geocode
      geocode:
        method: plss
        plss_fields: # indicate which PLSS fields are present in the source data and how to extract them using existing modes
          state:
            mode: constant
            constant: "MT"
          meridian: 
            mode: constant
            constant: "20"
          township_num:
            mode: column
            column: "Twpn"
          township_frac:
            mode: none
          township_dir:
            mode: column
            column: "Twpd"
          range_num:
            mode: column
            column: "Rngn"
          range_frac:
            mode: none
          range_dir:
            mode: column
            column: "Rngd"
          section:
            mode: column
            column: "WH_Sec"
    
    state_alpha:
      mode: constant
      constant: "MT"        
    
    epa_region:
      mode: constant
      constant: 8        
    
    county_name:
      mode: column
      column: "County"        
    
    geoid:
      mode: lookup
      lookup:
        columns: ["state_alpha", "county_name"]
        table: us_counties
        key_fields: ["state_alpha", "county_name"]
        return_field: "geoid"  # column in the table to return
    
    well_id:
      mode: column
      column: "API #"        
    
    well_id_desc:
      mode: constant
      constant: "API Number"        
    
    well_subtype:
      mode: crosswalk
      crosswalk:
        column: "WellType"
        map:
          "Injection, EOR": "2R"
          "Injection - Disposal": "2D"
          "Oil": "0X"
          "Gas": "0X"

    well_subtype_raw:
      mode: column
      column: "WellType"
    
    well_class:
      mode: lookup
      lookup:
        columns: "well_subtype"     # a field (or list of fields) already resolved earlier in processing pipeline
        table: well_subtypes           # reference table name (us_counties | us_states | uic_authority)
        key_fields: "well_subtype"           # column(s) in the table to match against
        return_field: "well_class"  # column in the table to return
    
    well_depth_ft:
      mode: none
    
    well_depth_ft_desc:
      mode: none
    
    operator:
      mode: column
      column: "CoName"
    
    operator_desc:
      mode: constant
      constant: "Company"
    
    status:
      mode: crosswalk
      crosswalk:
        column: "WellStatus"
        map:
          "Active Injection": "Active"
          "Permitted Injection Well": "Other"
          "Abandoned - Unapproved": "Inactive"
          "Revoked Inj. Permit": "Other"
          "Producing": "Active"
          "Temporarily Abandoned": "Inactive"
          "Spudded": "Other"
          "Shut In": "Inactive"
          "Permit to Drill": "Other"
    
    status_raw:
      mode: column
      column: "WellStatus"
    
    date:
      mode: column
      column: "Dt_Effect"

    date_desc:
      mode: constant
      constant: "Permit Date"
    

   
      