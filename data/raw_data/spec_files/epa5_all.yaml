#######################################################################################
# epa5_all
#######################################################################################

##############################################################
### DATA SOURCE
##############################################################
provenance:
  agency: "EPA Region 5"     # name of agency from which dataset was retrieved (e.g. WV Dept of Environmental Protection, EPA Region 3, etc.)
  source_address: "zipf.lynn@epa.go"    # email (if provided by a person) or URL (if downloaded from a website)
  date_retrieved: "2025-08-15"    # date the data was retrieved/received from the source (YYYY-MM-DD)
  notes: "Received post FOIA submission"    # any notes on the file itself (processing steps, etc.)

##############################################################
### SPECS
##############################################################
sheets:

  "Query2":

    load_specs:
      header_row: 0      # 0-indexed row number of the header row in the source sheet
      data_cols: "A:H"     # passed to usecols in pd.read_excel() to select the columns to read in (e.g. "A:Z" or "A,B,C,D,E" or [0,1,2,3,4])
    
    coordinates: # only applicable to coordinates field name
      mode: reproject
      reproject:
        x_columns: "well_long"   # source column(s) for x-coordinate values (longitude)
        y_columns: "well_lat"  # source column(s) for y-coordinate values (latitude)
        input_format: "dd" # input format: dd | dd_combined |dms_colon | dms_compact | dms_expanded | northing_easting
        datum:                # source datum (coordinate reference system) of the input coordinates (e.g., EPSG:26917). Put mode none if unknown.
          mode: none
      notes: "Unknown source CRS. Assuming NAD83 (EPSG:4269)."     
    
    state_alpha:
      mode: extract
      extract:
        column: "p_state_id"
        method: slice
        slice:
          start: 0
          end: 2 
    
    epa_region:
      mode: constant
      constant: 5      
    
    county_name:
      mode: locate
      notes: "No column with county code available. Use location to determine county name."        
    
    geoid:
      mode: lookup
      lookup:
        column: "county_name"     # a field already resolved earlier in processing pipeline
        table: us_counties           # reference table name
        key_field: "county_name"      # column in the table to match against
        return_field: "geoid"     # column in the table to return       
    
    well_id:
      mode: column
      column: "p_state_id"

    well_id_desc:
      mode: constant
      constant: "Well ID"       
    
    well_subtype:
      mode: column
      column: "hq_code"

    well_subtype_raw:
      mode: column
      column: "hq_code"

    well_class:
      mode: lookup
      lookup:
        column: "well_subtype"     # a field already resolved earlier in processing pipeline
        table: well_subtypes           # reference table name
        key_field: "well_subtype"           # column in the table to match against
        return_field: "well_class"  # column in the table to return
    
    well_depth_ft:
      mode: column
      column: "TOTAL_DEPTH"
    
    well_depth_ft_desc:
      mode: constant
      constant: "MD"
      notes: "Depth reported as Total Depth and assumed to be representative of Measured Depth."
    
    operator:
      mode: column
      column: "fac_name"
    
    operator_desc:
      mode: constant
      constant: "Company"
    
    status:
      mode: none
    
    status_raw:
      mode: none
    
    date:
      mode: none
    
    date_desc:
      mode: none
    

   
      