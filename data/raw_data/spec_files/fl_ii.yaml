#######################################################################################
# fl_ii
#######################################################################################

##############################################################
### DATA SOURCE
##############################################################
provenance:
  agency: ""    # name of agency from which dataset was retrieved (e.g. WV Dept of Environmental Protection, EPA Region 3, etc.)
  source_address: ""    # email (if provided by a person) or URL (if downloaded from a website)
  date_retrieved: ""    # date the data was retrieved/received from the source (YYYY-MM-DD)
  notes: ""    # any notes on the file itself (processing steps, etc.)

##############################################################
### SPECS
##############################################################
sheets:

  "WELLS":

    load_specs:
      header_row: 0       # 0-indexed row number of the header row in the source sheet
      data_cols: "A:AZ"     # passed to usecols in pd.read_excel() to select the columns to read in (e.g. "A:Z" or "A,B,C,D,E" or [0,1,2,3,4])
    
    coordinates: # only applicable to coordinates field name
      mode: reproject
      reproject:
        x_columns: "LONGITUDE"   # source column(s) for x-coordinate values (longitude)
        y_columns: "LATITUDE"  # source column(s) for y-coordinate values (latitude)
        input_format: "dd" # input format: dd | dd_combined |dms_colon | dms_compact | dms_expanded | northing_easting
        datum:                # source datum (coordinate reference system) of the input coordinates (e.g., EPSG:26917). Put mode none if unknown.
          mode: none
      # notes: "Unknown source CRS. Assuming NAD83 (EPSG:4269)."     
    
    state_alpha:
      mode: constant
      constant: "FL"        
    
    epa_region:
      mode: constant
      constant: "Region 4"
    
    county_name:
      mode: column
      column: "COUNTY"        
    
    geoid:
      mode: lookup
      lookup:
        columns: ["state_alpha", "county_name"]
        table: us_counties
        key_fields: ["state_alpha", "county_name"]
        return_field: "geoid"     # column in the table to return         
    
    well_id:
      mode: column
      column: "API_NO"        
    
    well_id_type:
      mode: constant
      constant: "API Number"        
    
    well_subtype:
      mode: none

    well_subtype_raw:
      mode: none
    
    well_class:
      mode: constant
      constant: "II"
    
    well_depth_ft:
      mode: column
      column: "MD"
    
    well_depth_ft_type:
      mode: constant
      constant: "MD"
    
    associated_entity:
      mode: column
      column: "COMPANY"
    
    associated_entity_type:
      mode: constant
      constant: "Operator"
    
    status:
      mode: crosswalk
      crosswalk:
        column: "CURRENT_STATUS"
        map:
          "DRY HOLE/P&A": "Inactive"
          "N/D": "Other"
          "P&A": "Inactive"
          "SWD": "Active"
          "PROD/P&A": "Inactive"
          "TA": "Inactive"
          "PROD": "Active"
          "JUNKED": "Inactive"
          "INJ": "Active"
          "INJ/P&A": "Inactive"
          "SWD/P&A": "Inactive"
          "INJ/TA": "Inactive"
          "PENDING": "Other"
          "PROD/TA": "Inactive"
          "EXPIRED": "Other"
          "ANODE WELL": "Other"
          "PERMIT SURRENDERED": "Other"
          "DRILLING": "Other"
          "DENIED": "Other"
    
    status_raw:
      mode: column
      column: "CURRENT_STATUS"
    
    date:
      mode: column
      column: "SPUD_DATE"
    
    date_type:
      mode: constant
      constant: "Spud Date"
    

   
      