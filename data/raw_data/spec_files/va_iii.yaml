#######################################################################################
# va_iii
#######################################################################################

##############################################################
### DATA SOURCE
##############################################################
provenance:
  agency: ""
  source_address: ""    # email (if provided by a person) or URL (if downloaded from a website)
  date_retrieved: ""    # date the data was retrieved/received from the source (YYYY-MM-DD)
  notes: ""

##############################################################
### SPECS
##############################################################
sheets:

  "Query1":

    load_specs:
      header_row: 0       # 0-indexed row number of the header row in the source sheet
      data_cols: "A:J"     # passed to usecols in pd.read_excel() to select the columns to read in (e.g. "A:Z" or "A,B,C,D,E" or [0,1,2,3,4])
    
    coordinates:
      mode: reproject
      reproject:
        x_columns: ["Long Degree", "Long Min", "Long Sec"]   # source column(s) for x-coordinate values (longitude)
        y_columns: ["Lat Degree", "Lat Min", "Lat Sec"]  # source column(s) for y-coordinate values (latitude)
        input_format: "dms_expanded" 
        datum:
          mode: none
    
    state_alpha:
      mode: extract
      extract:
        column: "ID"
        method: slice
        slice:
          start: 0
          end: 2       
    
    epa_region:
      mode: constant
      constant: "Region 3"        
    
    county_name:
      mode: locate
      notes: "No column with county code available. Use location to determine county name."        
    
    geoid:
      mode: lookup
      lookup:
        columns: ["state_alpha", "county_name"]
        table: us_counties
        key_fields: ["state_alpha", "county_name"]
        return_field: "geoid"     # column in the table to return       
    
    well_id:
      mode: column
      column: "ID"        
    
    well_id_type:
      mode: constant
      constant: "Well ID"        
    
    well_subtype:
      mode: none

    well_subtype_raw:
      mode: none
    
    well_class:
      mode: column
      column: "Well Class"
    
    well_depth_ft:
      mode: none
    
    well_depth_ft_type:
      mode: none
    
    associated_entity:
      mode: column
      column: "Name"
    
    associated_entity_type:
      mode: constant
      constant: "Operator"
    
    status:
      mode: none
    
    status_raw:
      mode: none
    
    date:
      mode: none
    
    date_type:
      mode: none
    

   
      