#######################################################################################
# wv_iii
#######################################################################################

##############################################################
### DATA SOURCE
##############################################################
provenance:
  agency: "WV Department of Environmental Protection" # name of agency from which dataset was retrieved (e.g. WV Dept of Environmental Protection, EPA Region 3, etc.)
  source_address: "charles.t.brewer@wv.gov"	# email (if provided by a person) or URL (if downloaded from a website)
  date_retrieved: "2025-12-01"	# date the data was retrieved/received from the source (YYYY-MM-DD)
  notes: "Received by email as PDF. Manually converted to .xlsx" # any notes on the file itself (processing steps, etc.)


##############################################################
### SPECS
##############################################################
sheets:

  "Sheet1":

    load_specs:
      header_row: 0       # 0-indexed row number of the header row in the source sheet
      data_cols: "A:J"     # passed to usecols in pd.read_excel() to select the columns to read in (e.g. "A:Z" or "A,B,C,D,E" or [0,1,2,3,4])
    
    coordinates:
      mode: reproject
      reproject:
        x_columns: "Lon"   # source column(s) for x-coordinate values (longitude)
        y_columns: "Lat"  # source column(s) for y-coordinate values (latitude)
        input_format: "dd" # input format: dd | dd_combined |dms_colon | dms_compact | dms_expanded | northing_easting
        datum:                # source datum (coordinate reference system) of the input coordinates (e.g., EPSG:26917). Put mode none if unknown.
          mode: none
      notes: "Unknown source CRS. Assuming NAD83 (EPSG:4269)."     
    
    state_alpha:
      mode: constant
      constant: "WV"        
    
    epa_region:
      mode: constant
      constant: "Region 3"        
    
    county_name:
      mode: locate
      notes: "County name is not provided in the source data. Will be determined based on coordinates."        
    
    geoid:
      mode: lookup
      lookup:
        columns: ["state_alpha", "county_name"]
        table: us_counties
        key_fields: ["state_alpha", "county_name"]
        return_field: "geoid"  # column in the table to return
    
    well_id:
      mode: column
      column: "API No."        
    
    well_id_type:
      mode: constant
      constant: "API Number"        
    
    well_subtype:
      mode: constant
      constant: "3X"

    well_subtype_raw:
      mode: column
      column: "Well Type"
    
    well_class:
      mode: constant
      constant: "III"
    
    well_depth_ft:
      mode: none
    
    well_depth_ft_type:
      mode: none
    
    associated_entity:
      mode: none
    
    associated_entity_type:
      mode: none
    
    status:
      mode: crosswalk
      crosswalk:
        column: "Well Status"
        map:
          "Shut-in": "Inactive"
          "Active": "Active"
    
    status_raw:
      mode: column
      column: "Well Status"
    
    date:
      mode: none
    
    date_type:
      mode: none
    

   
      