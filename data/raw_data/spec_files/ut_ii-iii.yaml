#######################################################################################
# ut_ii-iii
#######################################################################################

##############################################################
### DATA SOURCE
##############################################################
provenance:
  agency: "UT Division of Oil, Gas and Mining" # name of agency from which dataset was retrieved (e.g. WV Dept of Environmental Protection, EPA Region 3, etc.)
  source_address: "https://dataexplorer.ogm.utah.gov/"	# email (if provided by a person) or URL (if downloaded from a website)
  date_retrieved: "2026-09-28"	# date the data was retrieved/received from the source (YYYY-MM-DD)
  notes: "Well subtype and status mappings based on descriptions from https://gis.utah.gov/products/sgid/energy/oil-gas-wells/."  	# any notes on the file itself (processing steps, etc.)


##############################################################
### SPECS
##############################################################
sheets:

  "ut_all.xlsx":

    load_specs:
      header_row: 0       # 0-indexed row number of the header row in the source sheet
      data_cols: "A:Q"     # passed to usecols in pd.read_excel() to select the columns to read in (e.g. "A:Z" or "A,B,C,D,E" or [0,1,2,3,4])
    
    coordinates: # only applicable to the coordinates field
      mode: geocode
      geocode:
        method: plss
        plss_fields: # indicate which PLSS fields are present in the source data and how to extract them using existing modes
          state:
            mode: constant
            constant: "UT"
          meridian: 
            mode: crosswalk
            crosswalk:
              column: "Meridian"
              map:
                "Salt Lake Principal Meridian" : 26
                "Uintah Special Meridian" : 30
          township_num:
            mode: column
            column: "Town"
          township_frac:
            mode: none
          township_dir:
            mode: column
            column: "Twp Dir"
          range_num:
            mode: column
            column: "Range"
          range_frac:
            mode: none
          range_dir:
            mode: column
            column: "Rng Dir"
          section:
            mode: column
            column: "Sec"
    
    state_alpha:
      mode: constant
      constant: "UT"        
    
    epa_region:
      mode: constant
      constant: "Region 8"        
    
    county_name:
      mode: column
      column: "County"        
    
    geoid:
      mode: lookup
      lookup:
        columns: ["state_alpha", "county_name"]
        table: us_counties
        key_fields: ["state_alpha", "county_name"]
        return_field: "geoid"  # column in the table to return
    
    well_id:
      mode: column
      column: "API"        
    
    well_id_type:
      mode: constant
      constant: "API Number"        
    
    well_subtype:
      mode: crosswalk
      crosswalk:
        column: "Well Type"
        map:
          "Dry Hole": "0X"
          "Oil Well": "0X"
          "Carbon Dioxide Well": "0X"
          "Gas Well": "0X"
          "Water Disposal Well": "2D"
          "Lithium Well": "3X"
          "Water Injection Well": "2R"
          "Gas Storage Well": "2H"
          "Oil Well/Water Disposal Well": "2D"
          "Gas Injection Well": "2R"
          "Gas Disposal Well": "2D"
          "Oil Well/Water Injection Well": "2R"
          "Oil Well/Gas Injection Well": "2R"
          "Gas Well/Water Disposal Well": "2D"
          "Combined Oil and Gas Well": "0X"
          "Helium Well": "0X"
          "Hydrocarbon Storage Well": "2H"
          "Potash Well": "3A"

    well_subtype_raw:
      mode: column
      column: "Well Type"
    
    well_class:
      mode: lookup
      lookup:
        columns: "well_subtype"     # a field (or list of fields) already resolved earlier in processing pipeline
        table: well_subtypes           # reference table name (us_counties | us_states | uic_authority)
        key_fields: "well_subtype"           # column(s) in the table to match against
        return_field: "well_class"  # column in the table to return
    
    well_depth_ft:
      mode: none
    
    well_depth_ft_type:
      mode: none
    
    associated_entity:
      mode: column
      column: "Operator"
    
    associated_entity_type:
      mode: constant
      constant: "Operator"
    
    status:
      mode: crosswalk
      crosswalk:
        column: "Well Status"
        map:
          "Plugged & Abandoned": "Inactive"
          "Location Abandoned - APD rescinded": "Other"
          "Returned APD (Unapproved)": "Other"
          "Shut-in": "Inactive"
          "Producing": "Active"
          "Temporarily-abandoned": "Inactive"
          "Active": "Active"
          "Inactive": "Inactive"
          "Drilling Operations Suspended": "Other"
          "Drilling Operations Suspended Conductor": "Other"
          "Approved Permit": "Other"
          "Producing oil or gas zone or lateral/Active Injection zone or lateral": "Active"
          "Drilling": "Other"
          "New Permit": "Other"
    
    status_raw:
      mode: column
      column: "Well Status"
    
    date:
      mode: none
    
    date_type:
      mode: none
    

   
      