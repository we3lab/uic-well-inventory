#######################################################################################
# va_ii-iii
#######################################################################################

##############################################################
### DATA SOURCE
##############################################################
provenance:
  agency: "EPA Region 3"    # name of agency from which dataset was retrieved (e.g. WV Dept of Environmental Protection, EPA Region 3, etc.)
  source_address: "zipf.lynn@epa.gov"	# email (if provided by a person) or URL (if downloaded from a website)
  date_retrieved: "2025-08-15"	# date the data was retrieved/received from the source (YYYY-MM-DD)
  notes: "Acquired through FOIA request to EPA." # any notes on the file itself (processing steps, etc.)


##############################################################
### SPECS
##############################################################
sheets:

  "Query1":

    load_specs:
      header_row: 0       # 0-indexed row number of the header row in the source sheet
      data_cols: "A:M"     # passed to usecols in pd.read_excel() to select the columns to read in (e.g. "A:Z" or "A,B,C,D,E" or [0,1,2,3,4])
    
    coordinates:
      mode: reproject
      reproject:
        x_columns: "Longitude"   # source column(s) for x-coordinate values (longitude)
        y_columns: "Latitude"  # source column(s) for y-coordinate values (latitude)
        input_format: "dd" # input format: dd | dd_combined |dms_colon | dms_compact | dms_expanded | northing_easting
        datum:                # source datum (coordinate reference system) of the input coordinates (e.g., EPSG:26917). Put mode none if unknown.
          mode: none
      notes: "Unknown source CRS. Assuming NAD83 (EPSG:4269)."
    
    state_alpha:
      mode: extract
      extract:
        column: "ID"
        method: slice
        slice:
          start: 0
          end: 2       
    
    epa_region:
      mode: constant
      constant: "Region 3"        
    
    county_name:
      mode: locate
      notes: "No column with county code available. Use location to determine county name."        
    
    geoid:
      mode: lookup
      lookup:
        columns: ["state_alpha", "county_name"]
        table: us_counties
        key_fields: ["state_alpha", "county_name"]
        return_field: "geoid"     # column in the table to return       
    
    well_id:
      mode: column
      column: "ID"        
    
    well_id_type:
      mode: constant
      constant: "Well ID"        
    
    well_subtype:
      mode: crosswalk
      crosswalk:
        column: "Well Class"
        map:
          "2D" : "2D"
          "3"  : "3X"

    well_subtype_raw:
      mode: column
      column: "Well Class"
    
    well_class:
      mode: lookup
      lookup:
        columns: "well_subtype"     # a field (or list of fields) already resolved earlier in processing pipeline
        table: well_subtypes           # reference table name (us_counties | us_states | uic_authority)
        key_fields: "well_subtype"           # column(s) in the table to match against
        return_field: "well_class"  # column in the table to return
    
    well_depth_ft:
      mode: none
    
    well_depth_ft_type:
      mode: none
    
    associated_entity:
      mode: column
      column: "Name"
    
    associated_entity_type:
      mode: constant
      constant: "Operator"
    
    status:
      mode: none
    
    status_raw:
      mode: none
    
    date:
      mode: none
    
    date_type:
      mode: none
    

   
      