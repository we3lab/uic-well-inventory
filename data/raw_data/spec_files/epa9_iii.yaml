#######################################################################################
# epa9_iii
#######################################################################################

##############################################################
### DATA SOURCE
##############################################################
provenance:
  agency: ""    # name of agency from which dataset was retrieved (e.g. WV Dept of Environmental Protection, EPA Region 3, etc.)
  source_address: ""    # email (if provided by a person) or URL (if downloaded from a website)
  date_retrieved: ""    # date the data was retrieved/received from the source (YYYY-MM-DD)
  notes: ""    # any notes on the file itself (processing steps, etc.)

##############################################################
### SPECS
##############################################################
sheets:

  "Sheet1":

    load_specs:
      header_row: 0       # 0-indexed row number of the header row in the source sheet
      data_cols: "A:J"     # passed to usecols in pd.read_excel() to select the columns to read in (e.g. "A:Z" or "A,B,C,D,E" or [0,1,2,3,4])
    
    coordinates: # only applicable to coordinates field name
      mode: reproject
      reproject:
        x_columns: "Longitude"   # source column(s) for x-coordinate values (longitude)
        y_columns: "Latitude"  # source column(s) for y-coordinate values (latitude)
        input_format: "dd" # input format: dd | dd_combined |dms_colon | dms_compact | dms_expanded | northing_easting
        datum:                # source datum (coordinate reference system) of the input coordinates (e.g., EPSG:26917). Put mode none if unknown.
          mode: none
      notes: "Unknown source CRS. Assuming NAD83 (EPSG:4269)."  
    
    state_alpha:
      mode: column
      column: "State"        
    
    epa_region:
      mode: constant
      constant: "Region 9"        
    
    county_name:
      mode: locate
      notes: "No column with county code available. Use location to determine county name."        
    
    geoid:
      mode: lookup
      lookup:
        columns: ["state_alpha", "county_name"]
        table: us_counties
        key_fields: ["state_alpha", "county_name"]
        return_field: "geoid"     # column in the table to return        
    
    well_id:
      mode: column
      column: "Well No."        
    
    well_id_desc:
      mode: constant
      constant: "Well ID"        
    
    well_subtype:
      mode: none

    well_subtype_raw:
      mode: none
    
    well_class:
      mode: column
      column: "Class"
    
    well_depth_ft:
      mode: column
      column: "Well depth (below land surface (bls), ft)"
    
    well_depth_ft_desc:
      mode: constant
      constant: "UK"
      notes: "Depth reported as Well Depth but unsure of what it represents."
    
    operator:
      mode: column
      column: "Operator"
    
    operator_desc:
      mode: constant
      constant: "Company"
    
    status:
      mode: none
    
    status_raw:
      mode: none
    
    date:
      mode: column
      column: "Date Well Construction Completed"
    
    date_desc:
      mode: constant
      constant: "Completion Date"
      