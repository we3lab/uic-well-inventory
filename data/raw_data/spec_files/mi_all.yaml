#######################################################################################
# mi_all
#######################################################################################

##############################################################
### DATA SOURCE
##############################################################
provenance:
  agency: "MI Department of Environment, Great Lakes, and Energy"   # name of agency from which dataset was retrieved (e.g. WV Dept of Environmental Protection, EPA Region 3, etc.)
  source_address: "https://gis-egle.hub.arcgis.com/search?collection=dataset&q=well"	# email (if provided by a person) or URL (if downloaded from a website)
  date_retrieved: "2025-12-01"	# date the data was retrieved/received from the source (YYYY-MM-DD)
  notes: "Downloaded from EGLE GIS open data portal." # any notes on the file itself (processing steps, etc.)


##############################################################
### SPECS
##############################################################
sheets:

  "Michigan_Oil%2C_Gas%2C_and_Mine":

    load_specs:
      header_row: 0       # 0-indexed row number of the header row in the source sheet
      data_cols: "A:AV"     # passed to usecols in pd.read_excel() to select the columns to read in (e.g. "A:Z" or "A,B,C,D,E" or [0,1,2,3,4])
    
    coordinates: # only applicable to coordinates field name
      mode: reproject
      reproject:
        x_columns: "X"   # source column(s) for x-coordinate values (longitude)
        y_columns: "Y"  # source column(s) for y-coordinate values (latitude)
        input_format: "dd" # input format: dd | dd_combined |dms_colon | dms_compact | dms_expanded | northing_easting
        datum:                # source datum (coordinate reference system) of the input coordinates (e.g., EPSG:26917). Put mode none if unknown.
          mode: none
      notes: "Unknown source CRS. Assuming NAD83 (EPSG:4269)."     
    
    state_alpha:
      mode: constant
      constant: "MI"        
    
    epa_region:
      mode: constant
      constant: "Region 5"        
    
    county_name:
      mode: column
      column: "CountyName"        
    
    geoid:
      mode: lookup
      lookup:
        columns: ["state_alpha", "county_name"]
        table: us_counties
        key_fields: ["state_alpha", "county_name"]
        return_field: "geoid"  # column in the table to return
    
    well_id:
      mode: column
      column: "api_num"        
    
    well_id_type:
      mode: constant
      constant: "API Number"        
    
    well_subtype:
      mode: crosswalk
      crosswalk:
        column: "WellType"
        map:
          "Dry Hole": "0X"
          "Location": null
          "Natural Gas Well": "0X"
          "Gas Production and Brine Disposal Well": "2D"
          "Brine Disposal Well": "2D"
          "Lost Hole": "0X"
          "Part 625 Test Well": "0X"
          "Part 625 Natural Brine Well": "0X"
          "Oil Well": "0X"
          "Gas Storage Well": "2H"
          "Gas Storage Observation Well": "0X"
          "Gas Condensate Well": "0X"
          "Part 625 Disposal Well": null
          "Water Injection Well": "2R"
          "Observation Well": "0X"
          "Gas Injection Well": "2R"
          "Other Well": null
          "Other Injection Well": "2X"
          "CO2 Injection Well": "2R"
          "Liquified Petroleum Gas Storage Well": "2H"
          "Part 625 Solution Mining Well": "3A"
          "Part 625 Storage Well": "2H"
          "Not Available": null
      notes: "Assuming that these subtypes are in line with Michigan EGLE well types (https://www.michigan.gov/egle/about/organization/geologic-resources-management/well-type-and-status)."


    well_subtype_raw:
      mode: column
      column: "WellType"
    
    well_class:
      mode: lookup
      lookup:
        columns: "well_subtype"     # a field (or list of fields) already resolved earlier in processing pipeline
        table: well_subtypes           # reference table name (us_counties | us_states | uic_authority)
        key_fields: "well_subtype"           # column(s) in the table to match against
        return_field: "well_class"  # column in the table to return
        
    well_depth_ft:
      mode: column
      column: "DTD"
    
    well_depth_ft_type:
      mode: constant
      constant: "DTD"
    
    associated_entity:
      mode: column
      column: "CompanyName"
    
    associated_entity_type:
      mode: constant
      constant: "Operator"
    
    status:
      mode: crosswalk
      crosswalk:
        column: "WellStatus"
        map:
          "Plugging Approved": "Inactive"
          "Plugging Approved - Part 616": "Inactive"
          "Terminated Permit": "Other"
          "Producing": "Active"
          "Active": "Active"
          "Plugging Completed": "Inactive"
          "Shut_In": "Inactive"
          "Plugging Completed- Part 616": "Inactive"
          "Injection Suspended": "Inactive"
          "Permitted Well": "Other"
          "Orphan": "Inactive"
          "Well Completed": "Other"
          "Temporarily Abandoned": "Inactive"
          "Plugged Back": "Other"
          "Drilling Completed": "Other"
          "0": "Other"
          "Not Available": "Other"
          "Sump": "Other"
          "Water Supply": "Other"

    status_raw:
      mode: column
      column: "WellStatus"
    
    date:
      mode: column
      column: "PermitDate"

    date_type:
      mode: constant
      constant: "Permit Date"
    

   
      