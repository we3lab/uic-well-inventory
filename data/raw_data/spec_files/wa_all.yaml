#######################################################################################
# wa_all
#######################################################################################

##############################################################
### DATA SOURCE
##############################################################
provenance:
  agency: "WA Department of Ecology" 	# name of agency from which dataset was retrieved (e.g. WV Dept of Environmental Protection, EPA Region 3, etc.)
  source_address: "john.bhend@ecy.wa.gov"    # email (if provided by a person) or URL (if downloaded from a website)
  date_retrieved: "2025-07-01"    # date the data was retrieved/received from the source (YYYY-MM-DD)
  notes: "-"	# any notes on the file itself (processing steps, etc.)


##############################################################
### SPECS
##############################################################
sheets:

  "Washigton State UIC Registratio":

    load_specs:
      header_row: 0       # 0-indexed row number of the header row in the source sheet
      data_cols: "A:V"     # passed to usecols in pd.read_excel() to select the columns to read in (e.g. "A:Z" or "A,B,C,D,E" or [0,1,2,3,4])
    
    coordinates:
      mode: reproject
      reproject:
        x_columns: "Well Longitude"   # source column(s) for x-coordinate values (longitude)
        y_columns: "Well Latitude"  # source column(s) for y-coordinate values (latitude)
        input_format: "dd" # input format: dd | dd_combined |dms_colon | dms_compact | dms_expanded | northing_easting
        datum:                # source datum (coordinate reference system) of the input coordinates (e.g., EPSG:26917). Put mode none if unknown.
          mode: none
      notes: "Unknown source CRS. Assuming NAD83 (EPSG:4269)."     
    
    state_alpha:
      mode: constant
      constant: "WA"        
    
    epa_region:
      mode: constant
      constant: "Region 10"        
    
    county_name:
      mode: column
      column: "Site County"        
    
    geoid:
      mode: lookup
      lookup:
        columns: ["state_alpha", "county_name"]
        table: us_counties
        key_fields: ["state_alpha", "county_name"]
        return_field: "geoid"  # column in the table to return
    
    well_id:
      mode: column
      column: "WellName"        
    
    well_id_type:
      mode: constant
      constant: "Well ID"        
    
    well_subtype:
      mode: crosswalk
      crosswalk:
        column: "EPA Well Type"
        map:
          "Aquifer Remediation (MTCA Order, VCP, PLIA, or Independent CU)": "5B6"
          "Stormwater (residential, paved streets, roofs, parking lots)": "5H1"
          "Industrial Stormwater (Industrial area runoff susceptible to spills/discharges)": "5H1"
          "Process Wastewater Disposal (For variety of wastes & wastewaters)": "5A"
          "Drainage (Landslide control, potable water overflow, pool drainage, lake level control)": "5H3"
          "Motor Vehicle Waste": "5K"
          "Aquifer Recharge": "5B1"
          "Other Wells (include other non-specified Class V wells)": "5X"
          "Heat Pump Return Flow": "5C2"
          "Septic System (Drainfield, well disposal)": "5F"
          "Geothermal Heat": "5C3"
          "Cooling Water (with No Additives)": "5A18"
          "Cooling Water (with Additives)": "5A19"
          "Experimental, CO2 Sequestration": "5G2"
          "CERCLA, RCRA (Degree or Order under CERCLA or RCRA)": "4A"
          "Cesspool": "5E"
          "Inject Brine from Oil and Gas Drilling Operations": "2D"
          "Subsidence Control Well (used to inject fluids to reduce or eliminate subsidence)": "5B3"

    well_subtype_raw:
      mode: column
      column: "EPA Well Type"
    
    well_class:
      mode: lookup
      lookup:
        columns: "well_subtype"     # a field (or list of fields) already resolved earlier in processing pipeline
        table: well_subtypes           # reference table name (us_counties | us_states | uic_authority)
        key_fields: "well_subtype"           # column(s) in the table to match against
        return_field: "well_class"  # column in the table to return

    well_depth_ft:
      mode: column
      column: "Well Depth"
    
    well_depth_ft_type:
      mode: constant
      constant: "UK"
    
    associated_entity:
      mode: column
      column: "Well Owner Name"
    
    associated_entity_type:
      mode: constant
      constant: "Operator"
    
    status:
      mode: crosswalk
      crosswalk:
        column: "Well Status"
        map:
          "Closed": "Inactive"
          "Active": "Active"
          "Unused": "Inactive"
          "Proposed": "Other"
    
    status_raw:
      mode: column
      column: "Well Status"
    
    date:
      mode: column
      column: "Well Construction Date"
    
    date_type:
      mode: constant
      constant: "Completion Date"
      notes: "Unsure if Well Construction Date is the same as Completion Date or Spud Date. Assuming Completion Date."
    

   
      