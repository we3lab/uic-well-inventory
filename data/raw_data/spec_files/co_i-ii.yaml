#######################################################################################
# co_i-ii
#######################################################################################

##############################################################
### DATA SOURCE
##############################################################
provenance:
  agency: "CO Energy and Carbon Management Commission"    # name of agency from which dataset was retrieved (e.g. WV Dept of Environmental Protection, EPA Region 3, etc.)
  source_address: "https://ecmc.colorado.gov/data-maps-reports/cogis-database/cogis-facility-inquiry"    # email (if provided by a person) or URL (if downloaded from a website)
  date_retrieved: "2026-11-18"    # date the data was retrieved/received from the source (YYYY-MM-DD)
  notes: "Data retrieved from COGIS Facility Inquiry. Added column API State Code with constant value 05 to support API number formulation."    # any notes on the file itself (processing steps, etc.)

##############################################################
### SPECS
##############################################################
sheets:

  "Page_1":

    load_specs:
      header_row: 0       # 0-indexed row number of the header row in the source sheet
      data_cols: "A:T"     # passed to usecols in pd.read_excel() to select the columns to read in (e.g. "A:Z" or "A,B,C,D,E" or [0,1,2,3,4])
    
    coordinates:
      mode: reproject
      reproject:
        x_columns: "Long"   # source column(s) for x-coordinate values (longitude)
        y_columns: "Lat"  # source column(s) for y-coordinate values (latitude)
        input_format: "dd" # input format: dd | dd_combined |dms_colon | dms_compact | dms_expanded | northing_easting
        datum:                # source datum (coordinate reference system) of the input coordinates (e.g., EPSG:26917). Put mode none if unknown.
          mode: none
      notes: "Unknown source CRS. Assuming NAD83 (EPSG:4269)."     
    
    state_alpha:
      mode: constant
      constant: "CO"        
    
    epa_region:
      mode: constant
      constant: "Region 8"        
    
    county_name:
      mode: locate
      notes: "County name is not provided in the source data. It will be determined based on the coordinates of the well."        
    
    geoid:
      mode: lookup
      lookup:
        columns: ["state_alpha", "county_name"]
        table: us_counties
        key_fields: ["state_alpha", "county_name"]
        return_field: "geoid"  # column in the table to return
    
    well_id:
      mode: concat
      concat:
        columns: ["API State Code", "API County Code", "API Sequence Num"]   # list of source columns to concatenate
        delimiter: ""
    
    well_id_type:
      mode: constant
      constant: "API Number"        
    
    well_subtype:
      mode: crosswalk
      crosswalk:
        column: "Well Class"
        map:
          "Disposal Well": "2D"
          "CLASS I EPA": "1X"
          "CLASS II EPA": "2X"
          "Enhanced Recovery Injection Well": "2R"

    well_subtype_raw:
      mode: column
      column: "Well Class"
    
    well_class:
      mode: lookup
      lookup:
        columns: "well_subtype"     # a field already resolved earlier in processing pipeline
        table: well_subtypes           # reference table name (us_counties | us_states | uic_authority)
        key_fields: "well_subtype"           # column in the table to match against
        return_field: "well_class"  # column in the table to return
    
    well_depth_ft:
      mode: none
    
    well_depth_ft_type:
      mode: none
    
    associated_entity:
      mode: column
      column: "Current Operator Name"
    
    associated_entity_type:
      mode: constant
      constant: "Operator"
    
    status:
      mode: crosswalk
      crosswalk:
        column: "Facility Status"
        map:
          "PA": "Inactive"
          "IJ": "Active"
          "TA": "Inactive"
          "SI": "Inactive"
          "AL": "Other"
          "WO": "Other"
          "EP": "Other"
          "PR": "Active"
    
    status_raw:
      mode: crosswalk
      crosswalk:
        column: "Facility Status"
        map:
          "PA": "PA - PLUGGED AND ABANDONED"
          "IJ": "IJ - INJECTING"
          "TA": "TA - TEMPORARILY ABANDONED"
          "SI": "SI - SHUT IN"
          "AL": "AL - ABANDONED LOCATION"
          "WO": "WO - WAITING ON COMPLETION"
          "EP": "EP - EXPIRED PERMIT"
          "PR": "PR - PRODUCING"
    
    date:
      mode: column
      column: "Status Date"
    
    date_type:
      mode: constant
      constant: "Status Date"

   
      