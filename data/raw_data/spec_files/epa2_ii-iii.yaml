#######################################################################################
# epa2_ii-iii.yaml
#######################################################################################

##############################################################
### DATA SOURCE
##############################################################
provenance:
  agency: "EPA Region 2"     # name of agency from which dataset was retrieved (e.g. WV Dept of Environmental Protection, EPA Region 3, etc.)
  source_address: "zipf.lynn@epa.go"    # email (if provided by a person) or URL (if downloaded from a website)
  date_retrieved: "2025-08-15"    # date the data was retrieved/received from the source (YYYY-MM-DD)
  notes: "Received post FOIA submission"    # any notes on the file itself (processing steps, etc.)

##############################################################
### SPECS
##############################################################
sheets:

  "Sheet1":

    load_specs:
      header_row: 0      # 0-indexed row number of the header row in the source sheet
      data_cols: "A:E"  # passed to usecols in pd.read_excel() to select the columns to read in (e.g. "A:Z" or "A,B,C,D,E" or [0,1,2,3,4])
    
    coordinates:
      mode: reproject
      reproject:
        x_columns: "Well Longitude"   # source column(s) for x-coordinate values (longitude)
        y_columns: "Well Latitude"  # source column(s) for y-coordinate values (latitude)
        input_format: "dd"      # input format: dd |dms_colon | dms_compact | dms_expanded | northing_easting
        datum:
          mode: none
      notes: "Unknown source CRS. Assuming NAD83 (EPSG:4269)."

    state_alpha:
      mode: locate
      notes: "No column with [county code / state identifier / etc.]. Use location to determine [field]."

    
    epa_region:
      mode: constant
      constant: "Region 2"
    
    county_name:
      mode: locate
      notes: "No column with [county code / state identifier / etc.]. Use location to determine [field]."
    
    geoid:
      mode: lookup
      lookup:
        columns: ["state_alpha", "county_name"]
        table: us_counties
        key_fields: ["state_alpha", "county_name"]
        return_field: "geoid"  # column in the table to return

    well_id:
      mode: column
      column: "Well Name"
    
    well_id_type:
      mode: constant
      constant: "Well Name"
    
    well_subtype:
      mode: none

    well_subtype_raw:
      mode: none
    
    well_class:
      mode: extract
      extract:
        column: "Well Class"
        method: slice
        slice:
          start: 5
          end: -1
    
    well_depth_ft:
      mode: column
      column: "Well Specific Depth (ft)"
    
    well_depth_ft_type:
      mode: constant
      constant: "UK"
      notes: "Column is labeled Well Specific Depth which does not map to any known well depth measurement."

    associated_entity:
      mode: none

    associated_entity_type:
      mode: none

    status:
      mode: none

    status_raw:
      mode: none

    date:
      mode: none

    date_type:
      mode: none