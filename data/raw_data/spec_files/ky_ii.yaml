#######################################################################################
# ky_ii
#######################################################################################

##############################################################
### DATA SOURCE
##############################################################
provenance:
  agency: "KY Office of Administrative Services, Energy & Environment Cabinet"     # name of agency from which dataset was retrieved (e.g. WV Dept of Environmental Protection, EPA Region 3, etc.)
  source_address: "capellan.mcfarland@ky.gov"    # email (if provided by a person) or URL (if downloaded from a website)
  date_retrieved: "2025-11-13"    # date the data was retrieved/received from the source (YYYY-MM-DD)
  notes: "FOIA request made by Isabel Escobar (UKY), as only KY residents could make requests."    # any notes on the file itself (processing steps, etc.)

##############################################################
### SPECS
##############################################################
sheets:

  "aaWellListwith Well Status":

    load_specs:
      header_row: 0       # 0-indexed row number of the header row in the source sheet
      data_cols: "A:K"     # passed to usecols in pd.read_excel() to select the columns to read in (e.g. "A:Z" or "A,B,C,D,E" or [0,1,2,3,4])
    
    coordinates: # only applicable to coordinates field name
      mode: reproject
      reproject:
        x_columns: "LONG"   # source column(s) for x-coordinate values (longitude)
        y_columns: "LAT"  # source column(s) for y-coordinate values (latitude)
        input_format: "dd" # input format: dd | dd_combined |dms_colon | dms_compact | dms_expanded | northing_easting
        datum:                # source datum (coordinate reference system) of the input coordinates (e.g., EPSG:26917). Put mode none if unknown.
          mode: none
      # notes: "Unknown source CRS. Assuming NAD83 (EPSG:4269)."     
    
    state_alpha:
      mode: constant
      constant: "KY"        
    
    epa_region:
      mode: constant
      constant: "Region 4"        
    
    county_name:
      mode: column
      column: "COUNTY"        
    
    geoid:
      mode: lookup
      lookup:
        columns: ["state_alpha", "county_name"]
        table: us_counties
        key_fields: ["state_alpha", "county_name"]
        return_field: "geoid"     # column in the table to return         
    
    well_id:
      mode: column
      column: "API #"

    well_id_type:
      mode: constant
      constant: "API Number" 
    
    well_subtype:
      mode: crosswalk
      crosswalk:
        column: "WELL TYPE"
        map:
          "SWD" : "2D"
          "SRI" : "2R"
          "WI"  : "2R"
          "WD"  : "2D"
          "ERI" : "2R"
          "TRI" : "2R"
    

    well_subtype_raw:
      mode: crosswalk
      crosswalk:
        column: "WELL TYPE"
        map:
          "SWD" : "Salt Water Disposal"
          "SRI" : "Secondary Recovery Injection"
          "WI"  : "Water Injection"
          "WD"  : "Water Disposal"
          "ERI" : "Enhanced Recovery Injection"
          "TRI" : "Tertiary Recovery Injection"

    well_class:
      mode: constant
      constant: "II"
    
    well_depth_ft:
      mode: column
      column: "TOTAL DEPTH"
    
    well_depth_ft_type:
      mode: constant
      constant: "MD"
      notes: "Depth reported as Total Depth and assumed to be representative of Measured Depth."
    
    associated_entity:
      mode: column
      column: "OPERATOR"
    
    associated_entity_type:
      mode: constant
      constant: "Operator"
    
    status:
      mode: crosswalk
      crosswalk:
        column: "WELL STATUS"
        map:
          "ABD" : "Inactive"
          "PA"  : "Inactive"
          "D&A" : "Inactive"
          "AI"  : "Active"
          "SI"  : "Inactive"
          "REP" : "Other"
          "TA"  : "Inactive"
          "UN"  : "Other"
          "AO"  : "Active"
          "CAN" : "Other"
          "EXP" : "Other"
          "DE"  : "Other"
          "PI"  : "Other"
          "REO" : "Active"
          "DRY" : "Inactive"

    status_raw:
      mode: crosswalk
      crosswalk:
        column: "WELL STATUS"
        map:
          "ABD" : "Abandoned, not plugged"
          "PA"  : "Plugged & Abandoned"
          "D&A" : "Dry & Abandoned, plugged"
          "AI"  : "Active Injection"
          "SI"  : "Shut In"
          "REP" : "Replaced by another permit"
          "TA"  : "Temporarily Abandoned"
          "UN"  : "Unknown Status"
          "AO"  : "Active Other"
          "CAN" : "Cancelled Permit, not drilled"
          "EXP" : "Expired Permit, not drilled"
          "DE"  : "Deepened by another permit"
          "PI"  : "Permit Issued"
          "REO" : "Reopened well"
          "DRY" : "Dry"
    
    date:
      mode: none
    
    date_type:
      mode: none
    

   
      