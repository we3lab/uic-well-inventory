#######################################################################################
# ar_all
#######################################################################################

##############################################################
### DATA SOURCE
##############################################################
provenance:
  agency: ""    # name of agency from which dataset was retrieved (e.g. WV Dept of Environmental Protection, EPA Region 3, etc.)
  source_address: ""    # email (if provided by a person) or URL (if downloaded from a website)
  date_retrieved: ""    # date the data was retrieved/received from the source (YYYY-MM-DD)
  notes: "Fixed one data entry error in cell (48114, Longitude) to add decimal point."  # any notes on the file itself (processing steps, etc.)

##############################################################
### SPECS
##############################################################
sheets:

  "ar_all.xlsx":

    load_specs:
      header_row: 0      # 0-indexed row number of the header row in the source sheet
      data_cols: "A:K"     # passed to usecols in pd.read_excel() to select the columns to read in (e.g. "A:Z" or "A,B,C,D,E" or [0,1,2,3,4])
    
    coordinates:
      mode: reproject
      reproject:
        x_columns: "Longitude"   # source column(s) for x-coordinate values (longitude)
        y_columns: "Latitude"  # source column(s) for y-coordinate values (latitude)
        input_format: "dd" # input format: dd |dms_colon | dms_compact | dms_expanded | northing_easting
        datum:
          mode: none
      notes: "Unknown source CRS. Assuming NAD83 (EPSG:4269)."
    
    state_alpha:
      mode: constant
      constant: "AR"
    
    epa_region:
      mode: constant
      constant: 6
    
    county_name:
      mode: column
      column: "CountyName"
    
    geoid:
      mode: lookup
      lookup:
        columns: ["state_alpha", "county_name"]
        table: us_counties
        key_fields: ["state_alpha", "county_name"]
        return_field: "geoid"  # column in the table to return
    
    well_id:
      mode: column
      column: "API"
    
    well_id_desc:
      mode: constant
      constant: "API Number"
    
    well_subtype:
      mode: crosswalk
      crosswalk:
        column: "WellType"
        map:
          "Oil - Production": "0X"
          "Seismic-Exploratory Well": "0X"
          "Natural Gas - Dry": "0X"
          "Water Supply": "0X"
          "Salt Water Disposal": "2D"
          "Expired Permit": null
          "Gas Storage": "2H"
          "Brine Supply Well": "3A"
          "Enhanced Oil Recovery": "2R"
          "Waste Disposal Well": null
          "Salt Water Injection": "2R"
          "Service Well": null
          "Brine Injection Well": "3A"
          "Gas Injector": "2R"
          "Unknown": null
          "Coal Bed Methane": "0X"
          "Coal Bed Methane Service Well": "0X"
          "Need Code": null

    well_subtype_raw:
      mode: column
      column: "WellType"
    
    well_class:
      mode: lookup
      lookup:
        columns: "well_subtype"     # a field already resolved earlier in processing pipeline
        table: well_subtypes           # reference table name (us_counties | us_states | uic_authority)
        key_fields: "well_subtype"           # column in the table to match against
        return_field: "well_class"  # column in the table to return
    
    well_depth_ft:
      mode: none
    
    well_depth_ft_desc:
      mode: none
    
    operator:
      mode: column
      column: "EntityName"
    
    operator_desc:
      mode: constant
      constant: "Company"
    
    status:
      mode: none
    
    status_raw:
      mode: none
    
    date:
      mode: none
    
    date_desc:
      mode: none
    

   
      