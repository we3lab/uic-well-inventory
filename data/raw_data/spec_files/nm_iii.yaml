#######################################################################################
# nm_iii
#######################################################################################

##############################################################
### DATA SOURCE
##############################################################
provenance:
  agency: "NM Energy, Minerals, and Natural Resources Department"     # name of agency from which dataset was retrieved (e.g. WV Dept of Environmental Protection, EPA Region 3, etc.)
  source_address: "phillip.goetze@emnrd.nm.gov"    # email (if provided by a person) or URL (if downloaded from a website)
  date_retrieved: "2026-02-03"    # date the data was retrieved/received from the source (YYYY-MM-DD)
  notes: "-"    # any notes on the file itself (processing steps, etc.)

##############################################################
### SPECS
##############################################################
sheets:

  "All Class III":

    load_specs:
      header_row: 0      # 0-indexed row number of the header row in the source sheet
      data_cols: "A:AD"     # passed to usecols in pd.read_excel() to select the columns to read in (e.g. "A:Z" or "A,B,C,D,E" or [0,1,2,3,4])
    
    coordinates: # only applicable to coordinates field name
      mode: reproject
      reproject:
        x_columns: "Longitude"   # source column(s) for x-coordinate values (longitude)
        y_columns: "Latitude"  # source column(s) for y-coordinate values (latitude)
        input_format: "dd" # input format: dd | dd_combined |dms_colon | dms_compact | dms_expanded | northing_easting
        datum:                # source datum (coordinate reference system) of the input coordinates (e.g., EPSG:26917). Put mode none if unknown.
          mode: constant
          constant: "EPSG:4269"    
    
    state_alpha:
      mode: constant
      constant: "NM"        
    
    epa_region:
      mode: constant
      constant: "Region 6"        
    
    county_name:
      mode: locate
      notes: "County name is not provided in the source data. It will be determined based on the coordinates of each well."        
    
    geoid:
      mode: lookup
      lookup:
        columns: ["state_alpha", "county_name"]
        table: us_counties
        key_fields: ["state_alpha", "county_name"]
        return_field: "geoid"  # column in the table to return
    
    well_id:
      mode: column
      column: "API"        
    
    well_id_type:
      mode: constant
      constant: "API Number"        
    
    well_subtype:
      mode: constant
      constant: "3X"

    well_subtype_raw:
      mode: column
      column: "Type"
    
    well_class:
      mode: constant
      constant: "III"
    
    well_depth_ft:
      mode: column
      column: "Measured Depth"
    
    well_depth_ft_type:
      mode: constant
      constant: "MD"
    
    associated_entity:
      mode: column
      column: "Current Operator"
    
    associated_entity_type:
      mode: constant
      constant: "Operator"
    
    status:
      mode: crosswalk
      crosswalk:
        column: "Status"
        map:
          "Plugged, Site Released" : "Inactive"
          "Active" : "Active"
          "Plugged, Not Released" : "Inactive"
          "Cancelled Apd" : "Other"
    
    status_raw:
      mode: column
      column: "Status"
    
    date:
      mode: column
      column: "Spud Date"
    
    date_type:
      mode: constant
      constant: "Spud Date"
    

   
      