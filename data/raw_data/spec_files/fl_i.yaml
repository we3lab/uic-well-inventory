#######################################################################################
# fl_i
#######################################################################################

##############################################################
### DATA SOURCE
##############################################################
provenance:
  agency: ""    # name of agency from which dataset was retrieved (e.g. WV Dept of Environmental Protection, EPA Region 3, etc.)
  source_address: ""    # email (if provided by a person) or URL (if downloaded from a website)
  date_retrieved: ""    # date the data was retrieved/received from the source (YYYY-MM-DD)
  notes: ""    # any notes on the file itself (processing steps, etc.)

##############################################################
### SPECS
##############################################################
sheets:

  "Sheet1":

    load_specs:
      header_row:  0     # 0-indexed row number of the header row in the source sheet
      data_cols: "A:AA"     # passed to usecols in pd.read_excel() to select the columns to read in (e.g. "A:Z" or "A,B,C,D,E" or [0,1,2,3,4])
    
    coordinates: # only applicable to coordinates field name
      mode: reproject
      reproject:
        x_columns: "Longitude"   # source column(s) for x-coordinate values (longitude)
        y_columns: "Latitude"  # source column(s) for y-coordinate values (latitude)
        input_format: "dms_colon" # input format: dd | dd_combined |dms_colon | dms_compact | dms_expanded | northing_easting
        datum:                # source datum (coordinate reference system) of the input coordinates (e.g., EPSG:26917). Put mode none if unknown.
          mode: none
      # notes: "Unknown source CRS. Assuming NAD83 (EPSG:4269)."     
    
    state_alpha:
      mode: constant
      constant: "FL"        
    
    epa_region:
      mode: constant
      constant: 4        
    
    county_name:
      mode: column
      column: "County"        
    
    geoid:
      mode: lookup
      lookup:
        column: "county_name"     # a field already resolved earlier in processing pipeline
        table: us_counties           # reference table name
        key_field: "county_name"      # column in the table to match against
        return_field: "geoid"     # column in the table to return         
    
    well_id:
      mode: column
      column: "WACS ID"        
    
    well_id_desc:
      mode: constant
      constant: "WACS ID"        
    
    well_subtype:
      mode: crosswalk
      crosswalk:
        column: "Injection Well Subtype"
        map:
          "INDUSTRIAL WASTEWATER WELL": "1I"
          "OTHER CLASS I WELL": "1X"
          "MUNICIPAL WASTEWATER WELL": "1M"
          "HAZARDOUS WASTE DISPOSAL WELL": "1H"
          "BLEND - MUNICIPAL & DEMINERALIZATION CONCENTRATE": "1X"
          "DEMINERALIZATION CONCENTRATE": "1W"
          "EXPLORATORY": "1X"

    well_subtype_raw:
      mode: column
      column: "Injection Well Subtype"
    
    well_class:
      mode: constant
      constant: "I"
    
    well_depth_ft:
      mode: column
      column: "Casing-Well Depth"
    
    well_depth_ft_desc:
      mode: constant
      constant: "TIZ"
    
    operator:
      mode: column
      column: "Site Name"
    
    operator_desc:
      mode: constant
      constant: "Site Name"
    
    status:
      mode: crosswalk
      crosswalk:
        column: "Injection Well Status"
        map:
          "ACTIVE": "Active"
          "NOT ASSOCIATED WITH UIC STATUS UNKNOWN": "Other"
          "CONVERTED TO A MONITOR WELL": "Other"
          "INACTIVE": "Inactive"
          "PERMANENTLY ABANDONED APPROVED": "Inactive"
          "PROPOSED": "Other"
          "WELL WAS NEVER CONSTRUCTED": "Other"
          "NEVER OPERATED, PERMIT NEVER USED": "Other"
          "TRANSFERRED": "Other"
          "UNDER CONSTRUCTION": "Other"
          "ACTIVITY NOT PERMITTED": "Other"
          "TRIBAL OWNERSHIP": "Other"
    
    status_raw:
      mode: column
      column: "Injection Well Status"
    
    date:
      mode: column
      column: "Facility Status Date"
    
    date_desc:
      mode: constant
      constant: "Status Date"
    

   
      